<style>
  :root{

    --bg:#f2efe6;
    --bg-elevated:#fbf9f2;
    --bg-sunken:#e8e3d4;
    --ink:#1c1f1b;
    --ink-soft:#5c584c;
    --ink-faint:#8b8677;
    --border:#d9d1ba;
    --border-strong:#b9ae90;
    --ai:#2f5a7a;        /* guard   - 藍 indigo  */
    --jade:#2c7a5c;      /* top     - 翡翠 jade  */
    --shu:#b8402f;        /* submission - 朱 vermilion */
    --kin:#96721a;        /* sweep   - 金 brass gold */

    --jade-bg:#e2f0e9;
    --shu-bg:#f7e6e2;

    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){

      --bg-elevated:#1a2224;
      --bg-sunken:#0d1213;

      --ink-soft:#b3ada0;
      --ink-faint:#7c8482;
      --border:#2c3a37;
      --border-strong:#41544e;
      --ai:#7fb4d8;
      --jade:#63c093;
      --shu:#e2836f;
      --kin:#e0bd6b;
      --ai-bg:#1c2c37;
      --jade-bg:#183028;
      --shu-bg:#33211d;

      --weave: rgba(224,189,107,0.04);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12181a;
    --bg-elevated:#1a2224;
    --bg-sunken:#0d1213;
    --ink:#ece7da;
    --ink-soft:#b3ada0;
    --ink-faint:#7c8482;
    --border:#2c3a37;
    --border-strong:#41544e;
    --ai:#7fb4d8;
    --jade:#63c093;
    --shu:#e2836f;
    --kin:#e0bd6b;
    --ai-bg:#1c2c37;
    --jade-bg:#183028;
    --shu-bg:#33211d;

  *{box-sizing:border-box;}
  body{
    background:
      repeating-linear-gradient(135deg, var(--weave) 0px, var(--weave) 1px, transparent 1px, transparent 14px),
      var(--bg);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.mincho{ font-family:'Shippori Mincho', serif; text-wrap:balance; }
  ::selection{ background:var(--shu); color:#fff; }

  #app{ max-width:560px; margin:0 auto; padding:1.5rem 1.1rem 4rem; }

  .top-title{
    display:flex; align-items:baseline; justify-content:space-between; gap:.75rem;
    margin-bottom:1.5rem;
  }
  .top-title h1{ font-size:1.5rem; font-weight:700; margin:0; letter-spacing:.02em; }
  .top-title .kana{ font-size:.72rem; color:var(--ink-faint); letter-spacing:.14em; }

  .card{
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
  }

  /* -- tsumeshogi diagram frame: double-rule border like a printed puzzle sheet -- */
  .frame{
    border:2px solid var(--border-strong);
    border-radius:16px;
    padding:4px;
    margin-bottom:1.25rem;
  }
  .frame-inner{
    border:1px solid var(--border);
    border-radius:12px;
    padding:1.35rem 1.2rem;
    background:var(--bg-elevated);
  }

  .lede{ color:var(--ink-soft); font-size:.95rem; margin:.15rem 0 1.4rem; max-width:38ch; }

  .stat-row{ display:flex; gap:.75rem; margin-bottom:1.4rem; }
  .stat{
    flex:1; background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    padding:.85rem .9rem; text-align:center;
  }
  .stat .num{ font-family:'Zen Kaku Gothic New',sans-serif; font-weight:900; font-size:1.5rem; font-variant-numeric:tabular-nums; display:block; color:var(--shu); }
  .stat .label{ font-size:.68rem; color:var(--ink-faint); letter-spacing:.06em; }

  .mode-toggle{
    display:flex; flex-wrap:wrap; background:var(--bg-sunken); border:1px solid var(--border); border-radius:12px;
    padding:4px; margin-bottom:1.4rem; gap:4px;
  }
  .mode-toggle button{
    flex:1 1 30%; min-width:0; border:none; background:transparent; color:var(--ink-soft);
    font-family:inherit; font-size:.82rem; font-weight:700; padding:.6rem .35rem; border-radius:9px;
    cursor:pointer; transition:background .15s,color .15s; white-space:nowrap;
  }
  .mode-toggle button.active{ background:var(--bg-elevated); color:var(--ink); box-shadow:var(--shadow); }
  .mode-toggle button:focus-visible{ outline:2px solid var(--shu); outline-offset:2px; }

  .btn{
    display:block; width:100%; font-family:inherit; font-size:1rem; font-weight:700;
    padding:.95rem 1.1rem; border-radius:12px; border:1px solid var(--border-strong);
    background:var(--bg-elevated); color:var(--ink); cursor:pointer; text-align:left;
    transition:transform .08s ease, border-color .15s, background .15s;
  }
  .btn:hover{ border-color:var(--shu); }
  .btn:active{ transform:scale(.98); }
  .btn:focus-visible{ outline:2px solid var(--shu); outline-offset:2px; }
  .btn-primary{
    background:var(--shu); border-color:var(--shu); color:#fff; text-align:center;
    font-size:1.05rem; padding:1.05rem;
  }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-ghost{ background:transparent; }
  .btn[disabled]{ cursor:default; opacity:.6; }

  .btn-stack{ display:flex; flex-direction:column; gap:.65rem; margin-top:1.1rem; }

  .choice{ display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
  .choice .dest-label{ font-size:1.02rem; font-weight:700; }
  .choice .chip{ flex-shrink:0; }

  .choice.is-correct{ background:var(--jade-bg); border-color:var(--jade); }
  .choice.is-wrong{ background:var(--shu-bg); border-color:var(--shu); }
  .choice.is-reveal{ background:var(--jade-bg); border-color:var(--jade); }

  .chip{
    display:inline-flex; align-items:center; gap:.35rem; font-size:.7rem; font-weight:700;

  .breadcrumb .crumb{
    flex-shrink:0; display:flex; align-items:center; gap:.35rem;
    font-size:.74rem; font-weight:700; padding:.3rem .55rem; border-radius:8px;

  .breadcrumb .crumb .dot{ width:.4rem; height:.4rem; border-radius:50%; }
  .breadcrumb .arrow{ color:var(--ink-faint); flex-shrink:0; align-self:center; }

  .node-label{ font-size:1.55rem; font-weight:700; margin:.15rem 0 .5rem; }
  .prompt{ color:var(--ink-soft); font-size:.95rem; margin-bottom:.2rem; }

  details.excerpt{ margin-top:.9rem; border-top:1px dashed var(--border); padding-top:.7rem; }
  details.excerpt summary{ cursor:pointer; font-size:.82rem; font-weight:700; color:var(--ink-soft); }
  details.excerpt summary:focus-visible{ outline:2px solid var(--shu); }
  details.excerpt .body{ font-size:.86rem; color:var(--ink-soft); white-space:pre-line; margin-top:.6rem; }
  details.excerpt .body h4{ font-size:.72rem; font-family:inherit; color:var(--ink-faint); letter-spacing:.06em; margin:.9rem 0 .25rem; }
  details.excerpt .body h4:first-child{ margin-top:0; }

  .feedback{ margin-top:1.1rem; padding:.95rem 1rem; border-radius:12px; font-size:.9rem; }

  .feedback.ng{ background:var(--shu-bg); color:var(--ink); border:1px solid var(--shu); }
  .feedback.resist{ background:var(--kin-bg); color:var(--ink); border:1px solid var(--kin); }
  .feedback .fb-title{ font-weight:700; margin-bottom:.35rem; }
  .feedback .fb-title.ok-text{ color:var(--jade); }
  .feedback .fb-title.ng-text{ color:var(--shu); }
  .feedback .fb-title.resist-text{ color:var(--kin); }
  .feedback .fb-body{ color:var(--ink-soft); white-space:pre-line; }

  .stamp-wrap{ display:flex; justify-content:center; margin:.5rem 0 1.4rem; }
  .stamp{
    width:108px; height:108px; border-radius:50%; border:4px solid var(--shu);
    display:flex; align-items:center; justify-content:center; transform:rotate(-9deg);
    background:color-mix(in srgb, var(--shu) 12%, transparent);
  }
  .stamp span{ font-family:'Shippori Mincho',serif; font-weight:800; font-size:2.6rem; color:var(--shu); }
  @media (prefers-reduced-motion: no-preference){
    .stamp{ animation: stamp-in .4s cubic-bezier(.2,1.4,.4,1) both; }
  }
  @keyframes stamp-in{ from{ transform:rotate(-9deg) scale(1.6); opacity:0; } to{ transform:rotate(-9deg) scale(1); opacity:1; } }

  .tap-chip{ display:flex; justify-content:center; margin:.5rem 0 1.4rem; }

  .result-heading{ text-align:center; font-size:1.25rem; font-weight:700; margin-bottom:.3rem; }
  .result-sub{ text-align:center; color:var(--ink-soft); font-size:.88rem; margin-bottom:1.4rem; }

  .ledger{ list-style:none; margin:0 0 1.3rem; padding:0; border-left:2px solid var(--border-strong); }
  .ledger li{ position:relative; padding:.15rem 0 1.05rem 1.1rem; }
  .ledger li:last-child{ padding-bottom:0; }
  .ledger li::before{
    content:''; position:absolute; left:-6px; top:.35rem; width:10px; height:10px; border-radius:50%;
    background:var(--bg-elevated); border:2px solid var(--border-strong);
  }
  .ledger li.cat-guard::before{ border-color:var(--ai); }
  .ledger li.cat-top::before{ border-color:var(--jade); }
  .ledger li.cat-submission::before{ border-color:var(--shu); }
  .ledger li.cat-sweep::before{ border-color:var(--kin); }
  .ledger .l-head{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
  .ledger .l-no{ font-weight:900; font-size:.78rem; color:var(--ink-faint); font-variant-numeric:tabular-nums; }
  .ledger .l-label{ font-weight:700; }
  .ledger .l-via{ font-size:.75rem; color:var(--ink-faint); margin-top:.15rem; }
  .ledger .l-revealed{ font-size:.68rem; color:var(--shu); font-weight:700; margin-left:.3rem; }
  .ledger .l-resisted{ font-size:.68rem; color:var(--kin); font-weight:700; margin-left:.3rem; }

  .btn-row{ display:flex; gap:.65rem; margin-top:.4rem; }
  .btn-row .btn{ flex:1; }

  footer.hint{ text-align:center; color:var(--ink-faint); font-size:.76rem; margin-top:2rem; }
  a{ color:var(--ai); }

  @media (max-width:380px){
    .node-label{ font-size:1.3rem; }
    .stat .num{ font-size:1.25rem; }
  }
</style>

<script id="graph-data" type="application/json">{"generatedAt":"2026-09-09T07:02:46.121Z","nodes":[{"id":"GuardConcept","label":"ガードポジション","category":"guard","content":{"steps":"1. 下になった選手が、自分の脚を相手の胴体や腕、脚に絡め、相手が上から抑え込んでくるのを防ぐ。\n2. ここからスイープ（上下の入れ替え）や、関節技・絞め技を仕掛ける。","tips":"- ガードは単なる防御ではなく、強力な攻撃の起点である。\n- **初心者が最初に覚えるべき原則（ガード編）**: クローズドガードは股上を浅く組んでお尻を落としたままにせず、相手を引きつけて深く高い位置で組む。相手の1本の袖を両手で掴む「2on1」で捕まえると力を使わず長時間キープできる。相手が完全に立ち上がってしまったら無理にしがみつかず、足を解いて片足の裏を相手の腰に当てるオープンガードへ切り替える。まずは「ガードを割らせないディフェンス」を徹底することで、パスを焦る相手に対して技が自動的に極まるようになる。","counter":"- 上からのパスガードに対抗する。\n- **トップ側の初心者原則**: ガード内で両手を成中線（体の中心線）を越えてクロスに置いたり、マットに直接手をついたりしない（腕十字・三角絞め・スイープの餌食になる）。手は必ず相手の体の上、成中線で分けた左右のフィールド内に置く。相手の帯を深く持つと肘が相手の体に入りすぎず三角絞め・腕十字を物理的にシャットアウトできる（ただし崩されやすいデメリットもある）。立ち上がる際は手を相手の体（胸・腹）に置いてそこへ体重を乗せてプレスしながら立つ。ガードを割ったら即座にパスを完成させようとせず、まず足を1本またいでハーフガードのポジションへ安全に進む（これだけで三角絞め・腕十字・オモプラッタのリスクが一気に消える）。","hasNote":true}},{"id":"ClosedGuard","label":"クローズドガード","category":"guard","content":{"steps":"1. 相手の腰に自分の骨盤を密着させるように深く引きつけ、相手の高い位置（股上が深い位置）で両足を回す。\n2. 相手の背中の後ろで、左右の足首をしっかりと深く噛み合わせる（ロックする）。\n3. 膝はギュッと締め付けるのではなく、軽く開いた状態をキープする。\n4. お尻をマットから少し上に浮かせ、自分の膝の位置が相手の背中を越える（下がる）ようにセットする。\n5. ロックが完成したら休まず、すぐに両足を引きつけて相手を前に崩し、相手に防御のフレーム（支え）を作らせないようにする。","tips":"- **足の組み方（深く組む）:** 股上が浅い状態で組んでしまうと、足の力で相手をコントロールできず、相手に上から体重を乗せられて簡単にガードを割られてしまう。必ず相手を十分に引きつけて深く組む。\n- **膝の開きと脱力:** 両膝を強く締めてしがみつこうとすると、脚がすぐに疲労してしまう。足首はしっかり噛ませたまま、膝を軽く開いておくことで、相手のプレッシャーを受け流しやすくなり長く耐久できる。\n- **腰と膝の位置（お尻を上げる）:** 膝が前に落ちて床についていると、相手に体重を乗せられやすい。お尻を浮かせて、膝が相手の背中側（高め）に位置するようにすることで、構造的に非常に割られにくい強固なガードになる。\n- **密着度（ヒップ・トゥ・ヒップ）:** 相手の姿勢を崩す際は、自分の腰と相手の腰を近づけて密着させる（ヒップ・トゥ・ヒップ）ことが不可欠。腰が離れている状態で膝だけを引いても相手を崩すことはできない。\n- **入れた瞬間に崩す:** クローズドガードに入れた瞬間に安心してお互いが休んでしまうと、相手にフレームを作られパスの準備を許してしまう。ガードを閉じた瞬間に一気に前後に振る、あるいは横に揺さぶって崩す。相手が立ち上がろうとする準備段階（片膝を立てた瞬間など）で足を引くと、相手の重心が崩れやすいため効果的。両膝を胸に引き寄せ足を前方に振るように連動させる（ハムカール）と、相手の頭を強制的に下げさせられる。\n- **襟グリップの即時解除:** 上の選手に襟を強く掴まれていると、どれだけ足で引きつけようとしても突っ張られて崩せない。突っ張りが効いた状態で肘を割られるとそのままガードを割られるため、攻防が始まったら真っ先に相手の襟グリップをカットする。","counter":"- （自分がトップ側の場合）中途半端に膝をついたまま攻めようとせず、相手の腕や胴体をコントロールして素早く立ち上がる。立ち上がる際はかかとに重心を乗せて後方に引く（つま先重心だと前に崩される）。「強力クローズ割り三種」として以下が有効：\n  - **脇パンチ立ち割り:** 相手の両脇（リブ〜脇の下）を両手でホールドして押し込み、後ろ足を踏み込んで三角形のベースを作りながら立ち上がる。かかとに重心を残し後方に座るようにプレッシャーをかけると、下の相手に崩されずロックを割れる。\n  - **グリップ制御立ち割り＆Zリフト:** 立つ前に自分が立ちたい側の相手の袖（手首）をグリップし、相手のお腹の上に押し当てて固定する。固定した側の足から立ち上がり、ピンした腕を上方向へ一気に引き上げ（Zリフト）、空いた手で相手の同側の膝を下に押し下げると脚のロックがパカッと割れる。\n  - **脇パンチ・膝お尻割り:** 両脇をパンチしてベースを作り立ち上がったら、片方の膝を相手のお尻の真裏（尾てい骨のすぐ下）に差し込んでストッパーにする。重心を後ろに引きながら座るように押し下げると、骨同士の圧力でロックが強制的に割れる。相手のブリッジ等の崩しに備え、胸を張ってベースを崩されないようにする。","hasNote":true}},{"id":"OpenGuard","label":"オープンガード","category":"guard","content":{"steps":"1. 両脚を開き、相手の胴体を挟まない状態で対峙する。\n2. 手で相手の襟、袖、または足首を掴み、足の裏を相手の腰、腰骨、またはバイセップス（上腕二頭筋）に当てる。\n3. 常に3点以上のコンタクト（両手両足のうち3箇所以上）を維持し、距離をコントロールする。","tips":"- 相手にパスガードされないよう、自分の膝を胸に引きつけてフレームを維持する。\n- 相手の袖や襟を引き、姿勢（ポスト）を崩し続ける。\n- **足はキックせず「置くだけ」（初心者が最初に覚えると得する原則）**: 相手を止めようと足をピンと蹴り伸ばすと外されやすく、自分のディフェンスの遊びも消える。足は曲げた状態でただ相手の通り道に置いておくだけでよい（キックボクシングでパンチの前に手をただ置いておくだけで打たれにくくなるのと同じ「障害物」理論）。払われても何度でも元の位置に戻すだけで相手はパスの組手を作れなくなる。\n- **腕は伸ばして固定、足は曲げて距離**: グリップした手は引かず、まっすぐ伸ばして「突っ張り棒（フレーム）」にする。足は常に曲げた状態を保ち、腰蹴りで適度な距離を作る（蹴りすぎると外される）。\n- **止めようとせず「まとわりつく」**: 力で相手を止めようとせず、相手の動きに同調してついていく感覚を持つとスタミナを消費しない。\n- **お尻を常に相手の正面に**: 相手が横に動いたら手足を引っ掛けて戻しながら、自分のお尻の向きを常に相手の正面に合わせ続ける。\n- **クローズドガードへの戻し方**: 相手がパスガードで踏ん張っている最中に強引に引き込もうとすると力がぶつかって失敗する。相手の攻撃が一段落して「戻った瞬間」を狙って引き込むと高確率で成功する。","counter":"- 相手が距離を詰めて潰してくる、あるいは左右に素早くパスしてくるのに対処する。","hasNote":true}},{"id":"HalfGuard","label":"ハーフガード","category":"guard","content":{"steps":"1. 仰向けまたは横向きの状態で、相手の片脚を自分の両脚で挟み込む。\n2. 脇を差す（アンダーフック）、または襟や袖をコントロールして相手の密着を防ぐ。\n3. 上体を少し起こし、半身（横向き）になってスペースを確保する。","tips":"- 完全に仰向け（フラット）に潰されるとパスガードされやすいため、常に半身の姿勢を保つ。\n- 脇の下に潜り込むか、相手の腰を押して距離を保つ。\n- **4の字クラッチの禁止**: 相手の足を両足で深く4の字に組んで固めるのは罠。お腹（骨盤）が伸びてフレームの力を失い、脇や足を持たれて引き裂かれるようにパスされる。足はつま先フックだけで軽く組み、代わりに膝を胸元に「ニョキっ」と高く出して体を縮めたポスチャーを常にキープする（相手が侵入すると膝フレームに引っかかりお手つきする）。\n- **戦術思想の違い**: [[ニーシールド]]は相手を「突き放す」ディフェンスガード、通常のハーフガードは相手を「呼び込んで密着させて崩す」攻撃思想のガード。\n- **相手が手をついて耐えた場合の起き上がり**: 突っ張っている手の下を強引に押しても崩れない。相手が支えているアングル（支点）を、自分が横の片面（側方）に向かって体を丸めながら起き上がることで強制的に上へずらす。\n- **ニースライスの強いプレッシャーへの対処**: 押し返そうとせず、体を縮めたまま相手の襟・肩に自分の体をぶら下げる。相手が引き離そう／押し進めようとする力に同調して起き上がると、力を使わず脇（アンダーフック）を差せる。\n- **脇差し後の足抜きスイープ**: 足を組んだまま起き上がろうとすると相手の体重が足に乗って重い。先に襟・肩を掴む手（左手など）へ相手の全体重を「乗せる」（前に崩す）ことで足が一瞬軽くなり、内側から外側へ足を回して入れ替えられる。","counter":"- 相手が頭を抱えて枕を取り、フラットに潰してくるのを防ぐ。","hasNote":true}},{"id":"Delariva","label":"デラヒーバガード","category":"guard","content":{"steps":"1. 片手で相手の片方の足首（かかと）を外側からしっかりと掴む。\n2. 同じ側の自分の脚を、相手の太も目の外側から内側に向けて引っ掛ける（デラヒーバフック）。\n3. もう一方の足は相手の腰や太もも、または袖を掴んでコントロールする。","tips":"- フックを深くかけ、相手の膝が外側に向くようにプレッシャーを与える。\n- 相手の足首を掴んでいる手を絶対に離さない。","counter":"- 相手がデラヒーバフックを外して（ニーカットパスなどで）潰してくることへのディフェンス。\n- **導入の前提**: ディフェンス力が伴わないままデラヒーバ単体で戦うと一度パスされた際のリカバリーが極めて難しい。強い[[クローズドガード]]→強い[[スパイダーガード]]の順で防御の基礎を固めてから、攻撃的なスパイスとしてデラヒーバを導入するのが安全なロードマップ。","hasNote":true}},{"id":"Spider","label":"スパイダーガード","category":"guard","content":{"steps":"1. 相手の両袖を、4本指を袖口の中に入れ、外側からフタをするように深く握り込む。\n2. エビ（ヒップエスケープ）をしてお尻を横にずらし、足の裏を相手の肘の外側から二頭筋（バイセップス）に当てる。\n3. 袖を自分の方へ強く引きつけつつ、足の裏を当てた方の脚を伸ばして相手の姿勢をコントロールする。\n4. スイープを狙う場合は、片足をマットについて強く踏み切り、二頭筋に当てているもう片方の足で相手を上に釣り上げ（跳ね上げ）るようにして横に倒す。","tips":"- **膝を外に張り出す:** 二頭筋を踏んでいる足の膝を内側に閉じてしまうと、相手に簡単に外されたり流されたりしてしまう。足の側頭部を外に張り出し、相手の腕がピンと張るように突っ張ることで、相手にとって非常に重く外されにくいフックになる。\n- **頭を浮かせて体重を乗せる:** 頭を床につけて丸まってしまうと、相手に足を捌かれやすくなる。背筋を伸ばし、頭を少し浮かせて自分の体重を足（フック）に乗せるように意識する。\n- **引きの強さ:** 強いスパイダーガードは、足で「蹴る」力だけでなく、袖を自分の方へ「引きつける」力が非常に強い。これにより相手は立ち上がっても常に前傾姿勢を強いられ、ベースを崩される。\n- **グレーグリップ（最速・最強の握り方）**: 指先でつまむとすぐ切られて指を痛める。袖口の生地を指の曲がる部分（付け根〜第2関節）で深く引っ掛け、3本指を折り返しの中に滑り込ませてから親指を上から被せて蓋をする。指を完全には入れていないため反則にならず最も強固。\n- **足の設置場所**: 相手の肩の上に乗せると威力半減。必ず肘の外側（関節のすぐ上、二頭筋あたり）に足裏を当てる。\n- **足が短い人の補助（シャローラッソー）**: リーチが足りずキックスパイダーが届かない場合、片足に浅く[[ラッソーガード]]をかけ、手前に煽りを入れて相手の姿勢を数センチ崩し距離を詰める。\n- **外される3大原因**: ①肘が外に開いて足を内側に畳まれ下に落とされる、②お腹を出して密着され足の張りが死ぬ、③片手のグリップを切られてもう片方の足を横に振られる。対策として近年推奨されるのは対角に両足を伸ばす形より「相手の二頭筋・脇にスネ（面）を当てる」ハーフスパイダー的キープ。お尻をマットから浮かせ続け、頭を丸めず張ることが必須。","counter":"- （自分がトップ側の場合）自分の肘を自分のあばら骨の前に畳み込み、相手の両膝の距離を真ん中に寄せる（縮める）ようにする。これによりフックの張りが弱くなり、足を外すことができる（[[スパイダーガードのディフェンス]]参照）。\n- **解除の3アプローチ**: ①下外し＝肘を相手の足の下に通して肋骨に密着させ、体幹を前に寄せる力で真ん中に戻す（手だけで剥がそうとしても蹴り力に負ける）。②上外し＝肘を滑り込ませたまま手のひらを前に突き出して足をベロンと上に剥がす。③踏み切りカット＝立ち上がり空いたスペース（二頭筋・足首）を足裏で力強く踏みつけてグリップを引きちぎる（スピード勝負で行わないと煽りを合わされて逆に潜り込まれる）。\n- **煽られた際の絶対NG**: 腰を引いてお腹を折り曲げて耐えるのは最大の悪手（潜り込みスペースを与える）。怖がらずお腹（骨盤）を前に突き出し胸を張って相手の蹴り足に全体重を当てにいくと、相手の足が動くスペースを完全に奪い、横への回転運動をロックできる。","hasNote":true}},{"id":"Lasso","label":"ラッソーガード","category":"guard","content":{"steps":"1. 相手の袖を掴んだ状態で、同じ側の脚を相手の脇の下から外側へ回して巻きつける（投げ縄の動き）。\n2. 足の甲を相手の広背筋（背中）に引っ掛けるようにしてテンションを保つ。\n3. もう一方の脚や手で相手のバランスを崩す。","tips":"- 袖のグリップを強力に維持し、相手の肘を内側に引き込む。\n- 巻きつけた脚のテンションを緩めず、常に相手の腕を封じ込める。\n- **種類**: ハーフラッソー（浅く前について）、シャローラッソー（同じく浅め、リテンションやコントロールで多用）、ディープラッソー。膝を相手の腰の前まで持っていくと逆に極めや被弾に繋がりやすいので基本的には避ける。\n- **腰の位置**: ラッソーを取った側に自分の腰を遠ざける（寄っていく）ことで相手の同側の肩が下がりコントロールしやすくなり、被弾もしにくい。\n- **く字ロック**: ラッソーを取った方の手は拳を鼠径部の前につけ、肘を先に貼っておく。腕を真っ直ぐ伸ばした1本の棒状にすると簡単にパスされる／腕を極められるので、肘を曲げた「く字」に保つ。\n- **足の裏の密着（背中メリ込み）**: 足の裏をただフックするだけでなく、相手の背中の裏側にしっかりメリ込ませるように使うと、道着の摩擦を使わず親指だけでも支えられ格段に外れにくくなる。\n- **初心者・足が短い選手にもおすすめ**: パワー系や体格差がある相手にも有効。","counter":"- 相手が巻きつきを外すために腕を回し（サークリング）、プレッシャーをかけてくるのを防ぐ。","hasNote":true}},{"id":"ColSleeve","label":"カラーアンドスリーブ","category":"guard","content":{"steps":"1. 片手で相手の対角の襟（カラー）を掴み、もう片方の手で相手の同側の袖（スリーブ）を掴む。\n2. 袖を掴んでいる側の足の裏を相手のバイセップス（上腕二頭筋）または肩に当てる。\n3. 襟を掴んでいる側の脚を相手の腰に当てるか、デラヒーバフックをかける。","tips":"- 襟を引いて相手の姿勢を低くさせ、袖を引いて相手のポスト（支え手）を奪う。\n- 足のプレッシャーと手の引きを連動させて、相手を常に前後に崩す。\n- **4点コントロールの基本フォーム**: 右手で対角の襟（持てるなら奥襟を深く握ると相手が立っていられずコンバットベース等に落ちる）、左手で袖口、左足で相手の腰、右足で相手の二の腕を踏む。\n- **ズボンを掴ませない拳の密着**: 袖側の手（左手）の拳を自分の太もも・骨盤付近にベタッと押し当てて密着させておくと、相手のフリーな手が伸びてくるスペースを物理的になくし、ズボンを掴まれてサイドに回られるのを防げる。\n- **腰蹴りで「くの字」を作る**: 腰を踏む足は置くだけでなく相手の腰を前方（奥）へ強く蹴り出し、相手を常に「くの字」に崩しておく。これがないと相手はお腹を突き出して良い姿勢を作り組み負けてしまう。\n- **二の腕を踏む足の肩蹴りリカバリー**: 相手に足を叩き落とされたら足回し（レッグサークル）で戻す。完全に肩で潰されて足回しできなくなった場合は、腰を踏んでいた足を素早く相手の肩に掛け替えて向こうへ強く蹴り出す（荷重が抜けて潰されていた足が軽くなり回収できる）。この際グリップが離れても問題なく、足が戻ってから襟を掴み直せばよい。","counter":"- 相手が襟を掴んでいる手を切る（グリップカット）か、袖側の足を外してパスを狙うのに対処する。","hasNote":true}},{"id":"XGuard","label":"Xガード","category":"guard","content":{"steps":"1. 相手 of 股下に潜り込み、自分の背中を相手の股下に密着させる。\n2. 自分の両脚をX字に交差させ、相手の片方の太ももと膝裏を挟み込んでコントロールする。\n3. 片手で相手のもう一方の足首をコントロールし、ベース（立ち位置）を奪う。","tips":"- 相手に上から潰されないよう、常に自分の脚のフレームで相手の体重を支える。\n- 相手の重心を前後に揺さぶり、常にアンバランスな状態（崩し）を維持する。\n- **キープの極意（挟むのを捨てる）**: 両脚で相手を横から挟み込んで固定しようとすると（クランプ）、手で足先を落とされるだけでテコの原理で簡単に外される。正解は「下から上へ押し上げ続けるリフトプレッシャー」。足を縮めて相手のお尻の真裏（骨盤の横）に膝と足をピタッとはめ込み、骨盤を天井へ浮かせるように相手を常に上方向へ押し上げると、相手はバランスボールに乗せられた状態になり床に力を伝える土台を失うため外せなくなる。","counter":"- 相手が腰を落としてベースを低くし、X字のフックを外してくることへの対策が必要。","hasNote":true}},{"id":"OneLegX","label":"ワンレッグXガード","category":"guard","content":{"steps":"1. 相手の片脚に対して、自分の内側の脚を相手の股の間に通す。\n2. 外側の脚の足の裏を、相手の腰骨にしっかりと当てる（フックする）。\n3. 相手の足首を自分の脇に抱え込み、両膝で相手の膝を絞めるようにして挟む。","tips":"- 腰に当てた足が相手の手で外されないよう、常にプレッシャーを与え続ける。\n- 相手の足首を脇でガッチリとロックし、相手がステップして逃げるのを防ぐ。\n- **キープの絶対法則（膝シールド）**: SXSの最大の弱点は、腰に当てたフック足を相手に外されて後ろにステップされること。フック足自体を無理に維持しようとするより、「内側の膝（シールド）」を常に相手の体に密着させ続けることが本当のキー。フックを外されても膝さえくっついていれば、相手が大きくステップしてきてもついていける（崩して戻す、または大きく相手についていく）。膝を離さないことを最優先し、それに対して蹴り上げなどで崩すのは二の次。\n- **基本の仕込み方**: 両襟を取り、バタフライガードの要領で相手の股下に入り込みながら腰を引き受けてSXSの形を作る。\n- **強い展開は「攻める」のではなく「反応を利用する」**: SXSは固めて維持するガードではなく、膝を揺さぶって相手のリアクション（大きくステップ、両手を前について耐える、まっすぐ被さってくる等）を見てから攻撃する反応型のガード。自分から動き続けて相手についていく意識が重要。","counter":"- 相手が腰のフックを外してステップオーバーしてくるのに対処する。","hasNote":true}},{"id":"Butterfly","label":"バタフライガード","category":"guard","content":{"steps":"1. 相手の内股に自分の両足の甲（フック）を掛ける。\n2. 背中を床につけず、上体をしっかりと起こして座った姿勢をキープする。\n3. 相手の片方の肩または襟を抑えつつ、反対側の脇の下を差す（アンダーフック）。\n4. 脇を差していない方の手で、相手の腕（肘など）をコントロールする。\n5. コントロールしている腕の方向（横方向）へ自分の体を倒し、下に入れたフックの足で相手を上に跳ね上げ、ひっくり返してスイープする。","tips":"- **背中を床につけない:** 最大の鉄則は背中を床にベタッとつけないこと。寝かされるとフックの力が伝わらなくなる。\n- **寝かされそうになった場合の対処:** 相手のプレッシャーで寝かされそうになったら、フックしている足を相手の足首や膝（下方向）へずらして押し出すことでスペースを作り、再び起き上がる。\n- **重力の利用:** 相手の背中の帯を深く持つバリエーションでは、自分自身が大きく横に傾くことで、重力を利用して相手を簡単に返すことができる。帯（オビ）を深く持たれると相手は頭を下げざるを得ず姿勢を保てなくなる。\n- フックの引っ掛け位置を少し変えるだけで[[ワンレッグXガード]]や[[Xガード]]へシームレスに変化できる、モダンなオープンガードシステムの共通基盤。","counter":"- 相手の胸を押すなどして、強制的に仰向けに寝かせることでガードの機能を無効化する。","hasNote":true}},{"id":"KneeShield","label":"ニーシールド","category":"guard","content":{"steps":"1. ハーフガードの体勢から、上の脚のスネ（シールド）を相手の胸や鎖骨あたりに斜めに当てる。\n2. 下の脚で相手の片脚を挟み、腰の位置をキープする。\n3. 両手で相手の肩や袖、襟をコントロールし、相手が密着してくるのを防ぐ。","tips":"- スネの角度を寝かせすぎず、相手のプレッシャーを骨で受けるフレームを作る。\n- 相手が頭を下げて潰してきたら、すばやく膝を抜いてガードを戻す。\n- **下側の腕（ボトムアーム）は必ず相手の腿の下へ**: 相手が上から被さって潰しにきたら、下の腕を相手の脇に高く残さず足の下へ深く滑り込ませて抱え込む。高い位置に残すと脇が開いて簡単に潰される。\n- **袖グリップの即カット**: 相手にボトム側の袖を上に引かれると骨盤の角度が失われフラットなハーフに潰される。引かれたら相手の手首の「腱」の部分を掌底で押し下げると簡単に切れる。\n- 切った直後に相手の股下へ手を滑り込ませ足首を軽くフックし、体をコンパクトに縮めた形を維持する。相手が突っ込んできた突進に合わせて足首を上へ切り上げると相手のバランスを前に崩せ、[[ディープハーフガード]]やリバースデラヒーバへ移行できる。\n- 膝が胸の前にあるため相手の股下にできる隙間から、下から手をこじ入れてズボンや道着を深くグリップできるのが強み。\n- シールドの維持にこだわりすぎず、パスされそうな最終ラインとして必ず[[クローズドガード]]へ戻すプロセスをシステムに組み込んでおく。","counter":"- 相手がニーシールドをすり抜けてスマッシュ（潰し）をかけてくることへのディフェンス。\n- **強固なニーシールドを崩すパス（トップ側の攻略）**:\n  - **スクリューブロー（ねじり肘）ソイングパス**: 相手の膝頭をグリップしたら極める側の肘を内側に返して(外旋)、肘全体を曲がらない一本の骨の柱にする。肩を前に出しながら真下へ体重を浴びせると膝のロックが崩壊する。\n  - **腿裏プレス＆肩裏ブロッキング**: 相手の腿の裏（腿缶）に自分の膝・体幹をガチッと挟み込んで動きを止めつつ、手を相手の肩裏（肩口の道着）から差し入れて生地を引き出し上から密着プレスして亀への逃げ道を塞ぐ。\n  - **後ろ重心＆手肘ベース**: 相手が足を大きく回してリカバリーしてくる（テコの支点＝頭の低さを利用）のに対し、自分の両手と肘をマットに強くついて支柱を作りつつあえて後ろ重心で上体を高く起こす。足回しのテコの隙間を物理的にゼロにできる。","hasNote":true}},{"id":"DeepHalf","label":"ディープハーフガード","category":"guard","content":{"steps":null,"tips":"- **深く潜ることが絶対条件**: 潜りが浅いと相手の全体重を胸や顔で受けてしまい身動きが取れなくなる。相手の重心の真下に自分の頭と肩がくるまで完全に入り込む。\n- **顔の密着**: 自分の顔（耳）を相手の太ももや腰にピッタリと密着させ、相手にスペースを与えないようにする。\n- **腕の隠し方（最大の注意点）**: 上の腕（相手の背中側にある腕）を無防備に出しておくと、[[キムラロック]]や[[ダースチョーク]]を極められるリスクが非常に高い。腕は相手の太ももの下に隠すか、相手のベルトやズボンをタイトに握って防御する。","counter":"- 首を殺して（枕を取って）相手が潜り込むスペースを潰す。\n- 相手が深く入る前にヒップを引いて距離を作り、ディープハーフに入らせない。","hasNote":true}},{"id":"SideControl","label":"サイドコントロール","category":"top","content":{"steps":"1. 仰向けの相手に対して、横方向（直角）から覆いかぶさる。\n2. 相手の頭側に回した腕で「枕」を取り、もう一方の腕で相手の脇の下や腰を抑える。\n3. 自分の胸を相手の胸に密着させ、体重をしっかりとかけて相手の動きを封じる。","tips":"- 相手にフレーム（腕や膝）を入れられないよう、隙間をなくして密着する。\n- 相手の頭の向きをコントロールすることで、ブリッジやエビを防ぐ。","counter":"- 相手がブリッジやエビ（ヒップエスケープ）でガードに戻そうとするのに対処する。","hasNote":true}},{"id":"Mount","label":"マウントポジション","category":"top","content":{"steps":"1. 仰向けの相手の胴体にまたがり、両膝を相手の脇の下（ハーフマウント）または腰の横につける。\n2. 両足の甲を相手の太ももやお尻の裏に引っ掛けるしてフックを作る。\n3. 上体を低くして相手に密着するか、上体を起こしてバランスを維持する。","tips":"- 相手のブリッジによる反転を防ぐため、常に相手の頭のコントロールやポスト（支え手）を用意する。\n- 膝をなるべく高く上げ、相手の腕の動きを制限する（ハイマウント）。\n- **初心者向けキープの基本（第3の支柱）**: サブミッションを狙う際に上体が相手の頭側に浮くと下からの力に弱くなる。相手の足元を覗き込むように体を低くスライドさせて重心を落とし、相手の頭のすぐ前に自分の肘をつき、さらに自分のおでこをマットに完全にこすりつける。頭を接地させることで体全体が相手の上に強固にロックされ、相手が下から暴れてもベースを崩さずキープし続けられる。","counter":"- 相手がブリッジで返そうとする、または肘を入れてガードに戻そうとするのに対処する。","hasNote":true}},{"id":"KneeOnBelly","label":"ニーオンベリー","category":"top","content":{"steps":"1. サイドコントロールから、相手のお腹の上に自分の片膝を乗せる。\n2. もう一方の脚は外側に大きく開き、マットを踏んでバランスを取る。\n3. 両手で相手の襟や肩を掴んで引き上げ、相手のお腹に自重を集中させる。","tips":"- お腹に乗せる膝以外の体重はすべて相手にかける感覚で圧力を与える。\n- 相手が嫌がって逃げようとする動きに合わせてバランスをキープする。","counter":"- 相手が乗せられた膝を手で押し外そうとする動き（これに対してアームバーを狙える）に対処する。","hasNote":true}},{"id":"NorthSouth","label":"ノースサウスポジション","category":"top","content":{"steps":"1. 相手の頭の上側から、相手と頭が逆方向になるように覆いかぶさる（69の体勢）。\n2. 自分の両脇で相手の両腕をブロックし、胸で相手の顔や胸を圧迫する。\n3. 両膝を広げて腰を落とし、ベースを低く保つ。","tips":"- 相手が腰を切って逃げ出さないよう、脇を締めて相手の肩の動きを封じる。\n- 相手の頭部にしっかり体重を乗せる。","counter":"- 相手が両手を伸ばして自分の腰を押し、エスケープを図るのに対処する。","hasNote":true}},{"id":"BackControl","label":"バックコントロール","category":"top","content":{"steps":"1. 相手の背後に密着し、自分の胸を相手の背中に当てる。\n2. 両脚のフック（かかと）を相手の股の間に内側から引っ掛ける（クロスしてはいけない）。\n3. 片腕を相手の首の上から、もう片腕を脇の下から通してクラッチする（シートベルトグリップ）。","tips":"- 両脚をクロスすると、アンクルロック（逆関節）で一本を取られる危険があるため絶対避ける。\n- 相手と自分の重心を常に重ね合わせ、密着を維持する。","counter":"- 相手がシートベルトクラッチを切り、背中をマットにつけて逃げようとするのに対処する。","hasNote":true}},{"id":"FrontHead","label":"フロントヘッドロック","category":"top","content":{"steps":"1. 立ち技や、相手が亀の姿勢（タートル）になった際、前方または斜め前方から相手の首を脇下に抱え込む。\n2. もう一方の手で相手の肘や脇をコントロールし、相手のタックルやエスケープを防ぐ。","tips":"- 相手の首へのプレッシャーを維持し、頭が抜けないように脇を締める。","counter":"- 頭を引き抜く、または相手の腰を押して距離を取る。","hasNote":true}},{"id":"Armbar","label":"腕ひしぎ十字固め","category":"submission","content":{"steps":"1. 相手の片腕を両手でしっかりと抱え込む\n2. 相手の頭側と胴体側に自分の両脚を回し、胸で相手の腕を固定する\n3. 両膝を締め、相手の親指が天井を向くようにコントロールする\n4. ゆっくりと腰を上げて、相手の肘関節を伸ばして極める","tips":"- 相手の親指の向きを常に意識する（親指が下や横を向くと関節が極まらない）。手首に自分の手首を添わせ、その手を自分の肘でホールドすることで親指の向きを固定し続ける。\n- 自分の両膝をしっかり締めて、相手の肩が動かないように固定する。ターゲットは相手の「肘の外側」。二頭筋・三頭筋あたりの上腕を自分の両太もも（内転筋）で上下から挟み込み、腕にねじれが出ないようにする。\n- **股関節の位置（詰めすぎ注意）**: お尻を相手の脇に密着させようと詰めすぎると相手の肩が自分の股の間に入り込み、肩の柔らかさで逃げられてしまう。相手の「肩の付け根」に自分の股関節（お尻）が噛み合う位置をキープするのが最も肩の可動域を殺せる。\n- 極める際は胸を大きく張り出す（ブリッジするように腰を反らす）ようにしてゆっくり寝転がりながら極め切る。\n- **クラッチを組んで耐える相手への対処（2アプローチ）**: ①自分の肘を相手の腕の内側に差し入れ、肘で相手の手首を深く抱え込んでホールドし、体全体で倒れ込んでクラッチを引きちぎる。②前傾姿勢になりがちな人・腰を痛めやすい人は、力任せに引かず自分の肘を滑り込ませて相手の手首を中心に戻すように「ねじる」ことでクラッチを剥がす。\n- **極まる2つの絶対条件**: 「相手の前傾姿勢」と「自分の股関節の上昇（競り上がり）」。クローズドガードの初期位置に足が残ったまま腕の力だけで引き込もうとすると股関節が上昇せず、腕がするりと抜けてしまう。\n- **実践3ステップ**: ①相手の襟を引くなどして少しだけ前傾姿勢を作る。②相手を強く「引きつける」のではなく、胸元にフレーム（チョップや襟持ち）を打って「これ以上近づくな」という距離感を作る（引きつけすぎると相手が密着し腰を動かすスペースが消える）。③フレームを支点にエビをして自分のお尻（股関節）を相手の胸元・脇の下の高さまでずり上げる。\n- **体が硬い人向け**: 腕十字の入りやすさは開脚の柔らかさではなく「自分の膝が相手の脇の裏側にどれだけ深く入るか」で決まる。引きつけに固執せず、フレームで密着をブロックしつつ下半身（お尻）だけを外側に大きく動かしてスペースを確保する。\n- **フラワースイープとの相性**: ストレートに腕十字だけを狙うより、先に[[フラワースイープ]]を仕掛ける方が極まりやすい。相手が耐えようと前傾プレッシャーを戻すことで腰がひねられ、こちらの足が相手の脇下へ自然に吸い込まれて股関節の上昇が強制的に完成する。スイープを嫌がって相手が腕を抜こうとした瞬間、そのままタイトな腕十字に自動的にスイッチできる。","counter":"- [[腕ひしぎ十字固めのディフェンス]]（両手をクラッチして防御し、相手の上に乗るようにして肘を抜く）参照","hasNote":true}},{"id":"Triangle","label":"三角絞め","category":"submission","content":{"steps":"1. 相手の一方の腕を押し込み、もう一方の腕を引く\n2. 脚を跳ね上げて相手の首と片腕をロックする\n3. ...","tips":"- 相手の頭を下げさせる（姿勢を戻させない）\n- 角度を90度に変える\n- **なぜ腕を1本挟むのか（物理ロジック）**: 足（太もも）は太く相手の首は細いパーツなので、足だけで首を絞めようとすると隙間が空いて圧力が伝わらない。相手の片腕を首と一緒に輪の中に挟み込み、挟まれた自分の肩を相手自身の頸動脈に押し当てて隙間をゼロにするのがフィニッシュの絶対条件。\n- **膝裏のゆとりを作るアングル変更**: 正面を向いたまま足を組もうとすると相手の肩幅に邪魔されて膝裏が届かず浅くなる。腕を流した方向へ自分の顔が相手の膝（側面）を向くように体を90度スライドさせると肩幅の障害が消え、膝裏に大きなゆとりが生まれて深くロックできる。\n- **ダブルクラッチ（後頭部引き＆ブリッジ）**: 足を4の字に深く組んだら手をカップ状にして指を組み、相手の後頭部（首の裏）に引っ掛けて手前に強く引き下げる。同時に腰を真上にブリッジのように突き上げる。「引く力」と「腰を突き上げる力」を連動させると一瞬でタップが取れる。\n- **誰でも得意になるコツ（2大条件）**: 「相手の前傾姿勢」と「自分の股関節の上昇（ずり上がり）」が揃わないと極まらない。相手を強く引きつけすぎるとベタッと密着されて股関節を動かすスペースが潰れるので、胸元にフレーム（前腕）を張って「これ以上近づくな」という距離感を保ちながら、フレームを支点にエビをして自分から股関節を相手の脇の下の高さまでずり上げる。","counter":"- [[三角絞めのディフェンス]] 参照","hasNote":true}},{"id":"Omoplata","label":"オモプラッタ","category":"submission","content":{"steps":"1. 相手の片方の手首または袖をコントロールする\n2. 脚を相手の脇の下から通し、肩の上に回して相手の顔の前に出す\n3. 上半身を起こし、両脚を揃えて相手の肩を固定する\n4. 相手の腰を抑えながら、自分の腰を前に突き出すようにして肩関節を極める","tips":"- 相手が前転（ローリング）して逃げるのを防ぐため、必ず相手の腰や帯を抑える\n- 自分の脚を伸ばし、相手の肩をマットに引き下げるように圧力をかける\n- **カラーアンドスリーブ（片襟片袖）からのエントリー**: 腰に当てた足を外して仕掛ける。対角の襟（クロスカラー）を持ち、肩甲骨を使うように前腕〜上腕をコントロールして相手を回転させないようにする。相手が座っている（コンバットベース）場合に中途半端に仕掛けると足をまたがれてパスされるリスクが高いため、その場合はまっすぐベルトを掴みに行くなどアプローチを変える。\n- **クローズドガードから腕十字を嫌がった相手への移行**: 腕十字を警戒して相手が力強く腕を引き抜いた瞬間、対角の袖（クロスグリップ）をキープしたまま空いた手で相手の股を下からすくう。体をまっすぐ縦に起こそうとすると相手に回転して逃げるスペースを与えるため、必ず相手の肩が完全にマットにつくまで体を横側にしっかり寝かせつけながらセットし、起き上がって極める。","counter":"- [[オモプラッタのディフェンス]]（前転して逃げる、または上体を起こして圧力を戻す）参照","hasNote":true}},{"id":"Kimura","label":"キムラロック","category":"submission","content":{"steps":"1. クローズドガード等から、相手が掴んできた襟などのグリップを切る（スクレイプやバンザイ動作を利用）。\n2. 相手の腕を抱え込むか、自分の肘を相手の肘の上に乗せて（インサイドアーム）ブロックし、内側のポジションを取る。\n3. ガードを解き、お尻を下げて（エビではなくヒップバック）上体を起こし、相手の肩口を制する。\n4. 相手の上側の腕に自分の三頭筋で体重をかけながら、相手の手首を掴み、もう片方の腕をその下から通して自分の手首を掴んでクラッチ（フィギュアフォー）を作る。\n5. 相手と十字（90度）の角度になるように体をスライドさせて仰向けになり、腕を上に押し込むようにして肩関節を極める。","tips":"- **グリップの使い分け:** 最初に相手の手首を掴む際は親指をかける「サムアラウンドグリップ」が適しているが、自分の手首を握ってクラッチを完成させる際は、両手とも親指を外す「サムレスグリップ（猿握り）」にする。これにより巻き込む力が強くなり、相手に腕を伸ばされにくくなる。まだ距離がある初期段階・相手が激しく暴れる状況ではサムアラウンドで確実に固定し、完全に引き込んでからサムレスへ移行するのがコツ。\n- **グリップを深くフックする:** 相手の手首を浅く掴むと手の中で回転されて解除される。指先ではなく自分の4本指の第2関節〜根元が相手の手首にしっかり引っかかるよう「頑丈なフック（コの字）」でホールドする。逆側の自分の手首も奥深くまで差し込み、相手の腕を自分の前腕でサンドイッチするように密着させるとクラッチ内部の隙間がゼロになる。\n- **肘の密着:** 相手の肘を常に自分の胸にぴったりと密着させ、スペース（遊び）をなくす。ここが離れると相手に起き上がられたり腕を伸ばされたりして逃げられる。\n- **極めの角度は相手の体勢で変える（重要）:** \n  - 相手が起きている・横を向いている場合は「90度ロック」：肘の角度を90度に固定し、一度相手の手を自分の胸に引きつけて密着させてからねじり上げる。\n  - 相手がマットにベタ寝（仰向け）している場合、90度に曲げて下へ押し込もうとしてもマットが邪魔で決まらない。腕を縦（相手の頭上・首に沿う方向）に伸ばし、あらかじめねじりを作って小指を大きく開いて上方に引き上げる「縦（ストレート）極め」に切り替える。\n- **スイープを狙う場合はあえて肩関節をフリーにする:** 極めるには肩関節を「詰まらせる」必要があるが、スイープしたい場合は逆に相手の腕を万歳させる方向へ誘導し、肩関節をあえて逃がす。腕を伸ばして支えを失った相手はロールするように簡単にひっくり返る。\n- **相手が道着やズボンを掴んでクラッチを固く防いできた場合:** 逆側の足で相手の頭を大きくまたぎ、またいだ膝の裏に相手の防衛している手を挟み込む。極める側と逆の手をマットにつき、またいだ足を前方にピンと伸ばしながら体を相手の頭側と逆方向へスライドさせるとテコの原理でクラッチが強制的に引き裂かれ、そのまま腕十字の形で安全に極められる。\n- **木村政彦の時間差アタック（歴史的背景）:** 技名の由来はエリオ・グレイシーを本技で下した柔道家・木村政彦から。木村自身が開発したとされる極め方は、相手の手首を掴んだら一度床方向へ強く「押し込み」、相手が反発して上に押し返した瞬間にその力を利用して一気に「引き上げて」極めるという時間差の入れ方。","counter":"- キムラロックをセットされたら、自分の帯を強く握るか、自分の太ももの下（股下）に手を入れて隠し、相手にクラッチを組ませないように防御する（[[キムラロックのディフェンス]]参照）。","hasNote":true}},{"id":"Americana","label":"アメリカーナ","category":"submission","content":{"steps":"1. サイドコントロールやマウントポジションから、相手の片腕の手首をマットに押し込む。相手がフレームを作って対抗してくる場合は、一度腰を切って相手の手首を巻き込みながら入れる。\n2. 片手で相手の手首を固定し、もう一方の腕を相手の肘の下から通して、自分の手首を掴む（フィギュアフォー／4の字クラッチを完成させる）。\n3. 相手の肘を自分の体の方に引き寄せながら、手首をマットに固定したまま、肘を上方向へ持ち上げるようにして肩関節を極める（ワイパーのような動き）。","tips":"- **体重で押し込む:** 手の腕力だけで押し込もうとすると抵抗されるため、自分の胸や上半身全体を使い、体重を前のめりに乗せてマットに相手の腕をトラップする。\n- **グリップと手首の形:** 相手の手首を指でギュッと「握る」のではなく、自分の手首の小指側を相手の手首に「合わせる」ようにして押し込む。自分の手首を掴む手は「サムレスグリップ」にし、手首を真っ直ぐ（または山なり）に保って猫の手のように深く引っ掛けて固定する。\n- **可動域を狭める:** 極める際は相手の手首を肩のラインより下（お尻側）へ引き下げてから肘を上げる。相手の肘に自分のおでこをつけて蓋をすると、腕を伸ばして逃げられにくくなる。\n- **パワーのある相手への「二の腕クラッチ＆おでこ蓋」**: 相手の力が強く手首を起こしてブリッジ等でエスケープを狙ってくる場合、相手の肘の下を通した手で手首ではなく自分自身の二の腕（バイセップ）を深く握り込み、おでこを相手の肘に強く押し当てて完全に蓋をする。顔を隠すようにおでこをマットに密着させると相手が手首を起こして押し返すスペースが物理的に消える。相手の反発を利用してクラッチを作り直し上方にスライドさせて極める。","counter":"- 腕を押し込まれて固定される前にフレームを作るか、腕を伸ばして「4の字」の形を作らせないようにする。","hasNote":true}},{"id":"Choke","label":"十字絞め","category":"submission","content":{"steps":"1. 相手の両襟を両手でクロスするように掴む（両手が手のひら上の「並十字」、片方ずつの「逆十字」などがある）。\n2. 親指を襟の内側に深く差し込んでグリップを固定する。\n3. 自分の手首を返し、両手首を相手の頸動脈に当てて引き寄せながら絞める。","tips":"- 手だけで絞めようとせず、脇を締めて自分の背中や体重の引きを利用する。\n- クローズドガードからは、脚で相手の腰を引き寄せた（引き付け）と極まりやすい。\n- **戦略的価値（ローリスク）**: 三角絞め・オモプラッタ・下からの腕十字は足を開く必要がありパスされるリスクを伴うが、十字絞めはクローズドガードを一度も割らずに仕掛けられる極めて安全な技。常に両手で襟をホールドしているため相手はエスケープしにくい。\n- **1本目を深く入れる2段階スライド**: いきなり最深部を狙わず、①片手で襟を外側に大きく開いて胸元に空間（膨らみ）を作る、②手を差し込んで突っかかったら足（ハサミ）で相手を手前に引き寄せ、生まれた隙にさらに奥（親指が耳の後ろに届く深さ）まで滑り込ませる、という「掴む→足で引く→さらに差し込む」の2段モーションを徹底する。\n- **2本目のクラッチ**: 1本目が深く入ると相手が頭を遠ざけるため手が届きにくい。足を引いて（腰をねじって）相手の頭を強制的に引き寄せてからアプローチする。奥襟を綺麗に探そうとせずに、相手の背中側の道着を「トントンと叩きながら手前に引く」と指が生地に自然に引っかかり一瞬でクラッチが完了する。\n- **腕勝負を排除する極め方**: 腕を横に開いて締めようとせず、両足を手前に引きながら相手の頭部を自分の胸の下（お腹の上）に押しつけてパッキングする。頭が固定されると絞めのアングルがタイトになり、手首を軽く返すだけで体重と体幹の圧力が直接頸動脈に伝わる。\n- **顎を強く引いて首を絶対に掴ませない相手への逆手順**: 片方の襟を開き親指側を下にして相手の首の下（喉元）を滑らせるように奥へ差し込み、もう片方の手を下から深く差し入れて前腕のチョップ部分が首元に当たるように掴む。この「下から通す」逆アプローチは顎を強く引く防御をすり抜けられる。ただし相手が頭を大きく上へ引き上げて逃げると緩むため、その場合は即座に通常の「手前に引き寄せる」十字絞めへ切り替える。","counter":"- 相手の手首をコントロールし、クロスされるのを防ぐ。","hasNote":true}},{"id":"Ezekiel","label":"エゼキエルチョーク","category":"submission","content":{"steps":"1. 相手の首の裏側に腕を回し、枕を取る（この動きは相手に警戒されないよう滑らかに行う）。\n2. 枕を取った側の手で、自分の逆側の道着の袖口（内側）に指を差し込んで握る。\n3. 逆の手（前腕、拳、または手刀）を相手の喉仏の前側に押し当て、両腕を交差させて絞める。","tips":"- **指の差し込み方:** 袖口を握る際、4本指を入れると相手にディフェンスされた時に小指が引っ張られて痛むことがあるため、3本指（人差し指、中指、薬指）をひっくり返すようにして入れると強固に固定できる。また親指は中に入れないルールに注意する。\n- **絞め方の極意（最大のコツ）:** 相手の上に密着して小さく丸まって絞めるのではなく、**自分の体を相手から足方向へ引き離す（ずり落ちるように腕を伸ばす）**。リーチを伸ばすように前腕を押し出すことで、テコの原理が強く働き強烈に極まる。バックから仕掛ける場合も同様に、下へずり落ちながら腕を伸ばす。","counter":"- **距離を取る:** 相手が枕を取りに来た瞬間に、上体を伸ばして距離（スペース）を作り、相手の手が首の後ろの深くまで届かないようにする。\n- **中筋をブロックする:** すでにセットされてしまった場合は、相手の肘の少し上（中筋という部位）を下から自分の両前腕で押し上げて、相手の腕が伸びて絞まるのを防ぐ。そのまま相手をひっくり返すか、相手の頭の方向（上方向）へ登るように逃げる。※自ら下（足方向）へ逃げようとすると、かえって相手のリーチが伸びて絞まりが強くなるので厳禁。","hasNote":true}},{"id":"RNC","label":"裸絞め","category":"submission","content":{"steps":"1. バックコントロールから、相手のディフェンスの手（手首）をコントロールして防御を防ぐ。\n2. 絞める側の腕を、相手の胸を這わせるようにして首（肩口）に深く差し込む。\n3. 絞める腕の肘の折り曲げ部分（V字部分）が相手の喉仏に合う位置まで深く入れ、自分の反対側の腕の上腕二頭筋（バイセップス）を掴んでロックする。\n4. 空いた手の手のひらを相手の後頭部（または肩口）に隠すようにセットする。\n5. 胸を張りながら両肘を自分の背中側に引き、同時に相手の後頭部を押すことで頸動脈を圧迫して極める。","tips":"- **深い巻き込み:** 差し込みが浅いと頸動脈を十分に圧迫できず極まらない。相手の肩口にしっかりと肘をジャストフィットさせる。\n- **あごで蓋をする:** 二頭筋を掴んだ後、相手の後頭部に置いた自分の手の上に自分の「あご」を乗せて蓋をする。これにより、相手に手でロックを剥がされるのを防ぐ。\n- **頭の密着:** 絞める際、自分の頭を相手の頭に密着させ、相手が頭を逃がすスペースを徹底的に消す。\n- **橈骨（とうこつ）差し込みで手を取らせない**: 絞め手を首に巻く際、手首を内外にひねって自分の橈骨（親指側の骨）を相手の首筋にピタッと刺し込むように密着させると、相手にその手を掴まれて引き剥がされにくくなる。\n- **肩口グリップロック**: 深く巻いた絞め手の指先で相手の肩口（道着の生地や肩そのもの）をガッチリ掴んで固定すると、腕が体幹に完全に固定され剥がされなくなる。","counter":"- 相手の腕が首に入る前にアゴを強く引き、自分の肩をすくめて首を隠す（ショルダーブロック）。\n- 相手の絞め腕を剥がす際は、相手の前腕を引っ張るのではなく、相手の手のひらのなかに指を4本入れてコントロールして剥がす（[[裸絞めのディフェンス]]参照）。","hasNote":true}},{"id":"BowArrow","label":"ボウアンドアローチョーク","category":"submission","content":{"steps":"1. バックコントロールから、片手で相手の対角の襟を深く掴む。\n2. もう片方の手で相手の同側のパンツの太もも部分、または足首を掴む。\n3. 自分の脚を相手の肩越しに回して体を固定し、弓を引く（ボウ・アンド・アロー）ように、襟を引きつつ体を反らせて絞める。","tips":"- 相手の脚をしっかりコントロールすることで、相手が回転して逃げるのを防ぐ。\n- 襟を持つ手首を返し、橈骨を頸動脈にしっかり当てる。\n- **詳細なセットアップ手順**: ①上側のフックを一度抜き、お尻をマットにつけて一度横に座る（相手を完全に自分の上にかぶせてエスケープの進路を塞ぐ）。②逆側の手で相手のズボンの横（膝付近の生地）をガッチリホールド。③自分の足を相手の胴体・首元をまたがせて深く掛け替え、両脚を深く組む。\n- **「背筋⇄脚伸ばし」の極め方（腕力を使わない）**: 組んだ両脚を前方へピーンと力強く蹴り伸ばして相手の胴体を引き離しつつ、同時に自分の背筋（背中の収縮力）を使って上体を後ろへ反らせる（弓を引くイメージ）。襟を引く手とパンツを引く手の距離が脚の蹴り伸ばしで極限まで引き伸ばされ、自重と背筋を合わせたテンションが一気に集中する。","counter":"- 襟側のグリップを切る、または相手の体をまたいでエスケープする。","hasNote":true}},{"id":"NorthChoke","label":"ノースサウスチョーク","category":"submission","content":{"steps":"1. ノースサウスポジションから、相手の首に自分の脇の下から腕を深く巻きつける。\n2. 自分の胸で相手の顔を抑え、相手の頭が回らないように固定する。\n3. 体を低く落とし、巻きつけた側の腕を引きながら、広背筋と自重で相手の頸動脈を圧迫する。","tips":"- 自分の肩をマットに密着させるほど低く沈むことで、完璧にロックする。\n- 相手が顎を引いている場合は、胸で相手の顎を押し上げるようにして喉元を開けさせる。","counter":"- 顎を引いて腕の進入を防ぎ、相手の腰を押してスペースを作る。","hasNote":true}},{"id":"AnkleLock","label":"アキレス腱固め","category":"submission","content":{"steps":"1. 相手の片脚を自分の脇の下に挟み込み、相手の足首（アキレス腱付近）を前腕の骨（橈骨）で抱える。\n2. 自分の両脚で相手の骨盤や太ももを挟んで距離を固定する。\n3. 自分の胸を張り、肩を後ろに引きながら腰を突き出してアキレス腱および足首関節を伸ばして極める。","tips":"- 前腕の硬い部分をアキレス腱の急所に的確に当てる。\n- 相手が自分の腰に近づいて圧力を抜くのを防ぐため、しっかりと脚のフックで突き放す。","counter":"- [[アキレス腱固めのディフェンス]] 参照","hasNote":true}},{"id":"Guillotine","label":"ギロチンチョーク","category":"submission","content":{"steps":"1. 前方から相手の首を片方の脇の下に深く抱え込み、クラッチ（手の甲を合わせるなど）を組む。\n2. 抱え込んだ側と反対側の足を相手の背中（または腰）に回し、ガードポジションをキープして相手の動きを封じる。\n3. 体を回し込む（ひねり込む）ように動かす、あるいは背筋などの体全体の力を使って絞め上げる。","tips":"- **捻りを利用する:** 腕の力だけで真っ直ぐ上に引き上げようとすると極まりにくい。首を抱えたら、自分の体を相手の体に対して回し込む（捻り込む）ようにして極める。\n- **足のポジション**: 片足を相手の肩（カラー）の前に、もう片方の足を相手の背中に深く引っ掛けて固定するとガードが安定する。\n- **バリエーションの使い分け:**\n  - **ノーアームギロチン (首のみ):** 相手の首だけを抱えて捻り込む。極める力が非常に強いが、クラッチが甘いと頭を上に引き抜かれてサイドパスを許すリスクがある。\n  - **アームインギロチン (片腕込み):** 相手の片腕ごと首を抱える。三角絞めのように腕を中に深く流す必要はなく、喉元に前腕の面が当たっていればよい。極めの威力は下がるが相手の頭が抜けにくく、極まらなくてもそのままスイープしてマウントを奪う展開に繋ぎやすい最も安全なギロチン。\n  - **ハイエルボーギロチン（マルセロチン）:** クラッチを組んだら自分の肘を相手の肩のラインを越えて天井方向へ高く跳ね上げる。これにより相手が解除の手を差し込む隙間を物理的に遮断できる。腕力でなく体重を首に乗せてプレスするだけなので非力な人や肩が柔らかい相手にも有効。壁やケージに相手を押し付けた状態でセットすると相手は後ろに逃げられずさらに強力（MMA/総合格闘技での応用）。\n  - **4フィンガーギロチン (顎持ち):** 相手のアゴの先端を4本指で包み込み（カップ）、もう片方の手のひらで上から完全に覆ってアシストする。深く入れすぎず「耳が半分見えるくらい」のあえて浅い角度でカップするのが最もタイトに極めるコツ。親指の付け根の骨の関節が頸動脈の一点に突き刺さり、力比べにならず一瞬で極まる。\n- **実戦での強さランキング（動画内評価）**: 1位ハイエルボー（自力エスケープがほぼ不可能）、2位4フィンガー（点で頸動脈を狙い撃ちしセットも容易）、3位アームイン（コンビネーション力が高く自滅リスクが最も低い）。","counter":"- 相手に首を抱えられた瞬間、足を背中に回されないように素早くパスガード（サイドコントロール）へ移行する。または、相手の脇の下から頭を抜くように動く（[[ギロチンチョークのディフェンス]]参照）。","hasNote":true}},{"id":"Anaconda","label":"アナコンダチョーク","category":"submission","content":{"steps":"1. フロントヘッドロックから、相手の首の下に腕を通し、反対側の脇の下から出す。\n2. 通した手で、自分の反対側のバイセップス（上腕二頭筋）を掴んでロックする。\n3. もう一方の手を相手の背中に当て、相手の体を中に巻き込むように回転（ロール）する。\n4. 相手の体を横向きに固定し、クラッチを絞り込んで頸動脈を圧迫する。","tips":"- 回転する際、相手の体と密着し、逃げるスペースを与えないこと。\n- 自分の肘を自分の胸に引き寄せるように絞め込む。\n- **腕を組ませない下処理**: 入っていく際に相手が腕を広げてポストしようとしてくるのは、前腕を使って腕をカットし中にしまわせることで防ぐ。\n- **横向きに潰すことが最重要**: 相手が天井を向いたままだと決まりにくい。膝を差し込みながら必ず相手を横向きに潰す。横で潰せたら足で相手の足を絡めてロックし、動けない状態を作ってから深く腕を組む。\n- **正しい極め方（手より腰）**: 手の力で締めようとするのではなく、耳の下に自分の腰を入れていくイメージで首を折るように圧迫する。腰を少し入れるだけで決まり、足で相手の足を絡めなくても極まる。\n- **「キャラメル系」足絡めの罠**: 足で相手の足を追いかけて絡めようとすると、相手に後ろへ逃げるスペースを与えてしまい亀（防御姿勢）にされやすい。基本はガブ（フロントヘッドロック）の状態で固定したまま決めにいく方が確実。\n- **相手が万歳して逃げようとした場合のカウンター**: 相手が体を反転（リバース）させようと万歳してきたら、その瞬間に足で相手の腕を挟んで横に固定する。この形が作れれば腰を入れなくても大体極まる。","counter":"- 相手が回転を合わせて防ぐ、または首側の腕を抜いてエスケープするのに対処。","hasNote":true}},{"id":"Darce","label":"ダースチョーク","category":"submission","content":{"steps":"1. 相手の脇の下から腕を通し、首の反対側から出す（アナコンダとは逆の向き）。\n2. 出した手で、自分の反対側のバイセップス（上腕二頭筋）を掴んでロックする。\n3. もう一方の手を相手の後頭部に当て、相手の頭を胸の中に押し込むようにして圧迫する。\n4. 相手の体を横向きにして体重を乗せ、絞り込む。","tips":"- 相手の脇の下に深く肩を入れ込み、クラッチの遊びを完全になくす。\n- 相手の頭が上がらないよう、しっかりと胸で抑えつける。","counter":"- 相手が脇を閉じて腕の侵入を防ぐ、または腰を切って逃げるのに対処。","hasNote":true}},{"id":"Baseball","label":"野球絞め","category":"submission","content":{"steps":null,"tips":null,"counter":null,"hasNote":false}},{"id":"FlowerSweep","label":"フラワースイープ","category":"sweep","content":{"steps":"1. 片手で相手の対角の袖を掴み、もう片方の手で相手の同側のパンツの裾（または足首）を掴む。\n2. クローズドガードを解除し、裾を掴んでいる側の脚を大きく振り子のように振って遠心力を得る。\n3. 袖を掴んでいる側の脚で相手の脇の下をすくい上げるようにして、横方向に回転させて返す。","tips":"- 足の裾をしっかり引き上げ、相手がその脚でステップして踏ん張れないようにする。\n- 体全体を円運動させるようにスムーズに動く。\n- **襟の握り方**: 柔道の襟（道着の縫い目・合わせ目の最も硬い部分）を手のひら全体で深くタイトに握り込むと上半身を強力に拘束できる。\n- **ズボンの「袋取り」**: 相手がベースを固めているとズボンの生地はピンと張って掴みにくい。一度両足（ガード）を手前に引いて相手を引き寄せると膝上の道着にたるみ（袋）ができるので、そこをホールドしてから元の位置に戻すと絶対に外れないグリップになる。\n- **なぜやりやすいのか**: 腕十字などから仕掛けるスイープは相手と距離があるが、フラワースイープは最初から相手と密着しているため自分の力が相手にダイレクトに伝わりやすく、非力でも決まりやすい。\n- **圧縮ホールドで完全に伸ばしを封じる**: 足をすくったら親指側へ強く引き寄せて相手の体をボールのように小さく圧縮する。これで相手は側方に手足を伸ばして耐えるベースを完全に失う。\n- **マウント奪取後は足を離さない**: 返した直後にすくった足をすぐ離さず、抱えたままマウントで一度動きを完全に止めてキープする（スイープ2点＋マウント4点の加点を確実に見届けてから次のアタックに移る）。","counter":"- 相手がベースを落とし、裾を掴んでいる手を切るのに対処。","hasNote":true}},{"id":"ScissorsSweep","label":"シザースイープ","category":"sweep","content":{"steps":"1. [[クローズドガード]]から、片手で相手の対角の奥襟（クロスカラーグリップ）を深く握る。親指が相手の耳の後ろあたりまで入るのが理想。もう片方の手で相手の袖口を握る。\n2. クローズドガードを解き、腰を切って（エビをして）体を横向きにする。\n3. 上側の足（スネ）を相手のお腹〜胸のラインに斜めに当ててフレーム（ニーシールド）を作る。下側の足はマットに這わせ、相手の膝の外側〜太もも付近にセットする。\n4. 相手の体を一度奥へ押し、相手が押し返してくる力に合わせて両手で強く手前に引きつけ、相手の重心を自分の体の上に「乗せる（浮かせる）」ようにする（プッシュ＆プル）。\n5. 相手の重心が浮いた瞬間に、上側のスネで相手の胴体を押し払いながら、下側の足で相手の膝を刈り、両足をハサミ（シザー）のように交差させて相手をひっくり返す。","tips":"- 襟を深く持つことで、相手の顔の向きを強制的に変え、相手が正しい姿勢を保てないようにコントロールできる。\n- ただ足をハサミのように動かすだけでは返らない。**プッシュ＆プルで相手の重心を完全に浮かせてから刈る**のが最重要ポイント。\n- 両足を同時に動かすのではなく、**先に上側の足（スネ）で相手を蹴り出して重心を横にずらし、その直後に下側の足で刈る**と、相手が足を出して耐えることができなくなる。\n- 襟を持った手の手首（小指側）を自分の胸に引きつけるようにして相手の首元にタイトなプレッシャーをかけると、より強力に崩せる。\n- 上側のスネを当てた際、相手が体重をかけて潰しにくるリスクがある。潰されそうなときはお尻を浮かせ、スネを相手の胸に当てて強固なフレームを保つこと。\n- **袖ではなく肘の外側を握る**: もう片方の手は袖口ではなく相手の肘の外側（関節の少し上）を深くタイトに握る。これにより相手が手を開いてマットにつきベースで耐える動きを無力化できる。\n- **スマッシュパス（押し潰し）への対抗**: 差し込んだ上側の足のつま先を強く上に向け（フレックス）、奥襟の引きと連動させてフレームを頑丈に保つ。\n- **刈る足の「ブラジリアンフック」化**: 下側の刈り足をただ床に添えるだけだと力が逃げる。足の甲を相手の太ももの内側・骨盤の側面に引っ掛ける（フックする）ようにセットすると、床を蹴る力が100%相手に伝わる。\n- **100%真横向きの徹底**: エビ（お尻の引き抜き）が中途半端でお尻が相手の正面に半分残っていると骨盤がロックされ体幹のひねりが使えない。お尻を完全に引き抜いて真横を向くと全身のひねりを乗せられる。\n- **釣り手の「目の前引き寄せ」**: 襟を握った手で強引に下や横に引っ張るのではなく、相手の頭を自分のアゴの真ん前に引きずり下ろして自分の方へ釣り上げるように誘導する。相手の全体重が自分のお腹〜胸に完全に乗り、驚くほど軽い力でひっくり返せる。\n- **相手がベースを頑丈に耐える場合**: 一度シットアップして高低差（スウェー）を作り、相手が反発して戻る勢いを利用して仕掛ける。あるいは足を相手の腰に置いて斜め前方向へ強く送り出し、前につんのめった瞬間に刈る。","counter":"- 腰を引いて重心を後ろに下げ、相手の上に体重を乗せさせない。\n- 相手が足をセットしてきた時点でベースを広く取り、刈られないようにする。","hasNote":true}},{"id":"DelarivaSweep","label":"デラヒーバスイープ","category":"sweep","content":{"steps":"1. デラヒーバガードから、相手の重心を前後に崩す。\n2. 掴んでいる相手の足首を引きながら、デラヒーバフック側の脚で相手を蹴り出す、または後ろに押し倒す。\n3. 相手がバランスを崩して倒れた瞬間、掴んでいる襟や袖を利用して素早く起き上がり、上を取る。","tips":"- 相手の足首をしっかり掴み続け、相手がステップしてバランスを立て直すのを防ぐ。\n- 相手の重心がどこにあるか（つま先かかとか）を見極めて押す。\n- **デラヒーバからXガード（モディファイドX）への詳細手順**: ①対角の奥襟を深くタイトにグリップ（頭を下げさせ体重を集める）。②かかとをホールド。③相手の腰を軽く蹴りながら上体を起こし、斜め後ろに倒れ込みながら襟を引き下げて自分のお尻に相手の体幹を乗せる。④相手の奥足が軽くなった瞬間に足回しで[[ワンレッグXガード]]を構築（かかとを相手の股関節のくぼみに乗せると外れにくい）。⑤逆の足で膝裏を蹴りながら伸ばし相手の膝を強制的に床につかせる。⑥お尻を外側へずらしつつ相手のふくらはぎを深く抱え込んで肩に乗せ、モディファイドXガードを完成させる。\n- **立ち上がりの注意**: 蹴り伸ばした後にゆっくりしていると足を掴まれて詰められる。上側の足をストッパーとして相手の体に残しつつ下側の足から先に真後ろへ引き抜くか、両足を同時に放して一気に体の後ろへ持ってくる（腕立て伏せの姿勢経由）ことで素早く立ち上がる。","counter":"- 相手がベースを低くし、掴まれた足を切って逃げるのに対処。","hasNote":true}},{"id":"SpiderSweep","label":"スパイダースイープ","category":"sweep","content":{"steps":"1. スパイダーガードの体勢から、相手の片方の袖を強く引き、その側の腕をポスト（支え手）にさせないようにする。\n2. もう一方の伸ばしている脚で相手の体を支え、同時に袖を引いている側の脚で相手の脇をすくい上げるように蹴り出す。\n3. 相手がバランスを崩して倒れたら、袖を離さずに素早く上体を起こしてマウントまたはサイドコントロールを奪う。","tips":"- 相手の腕を引っ張って完全にロックし、相手が手をついてこらえられないようにする。","counter":"- 相手がベースを低くし、袖のコントロールを切ろうとするのに対処。","hasNote":true}}],"edges":[{"from":"GuardConcept","to":"ClosedGuard","type":"移行"},{"from":"GuardConcept","to":"OpenGuard","type":"移行"},{"from":"GuardConcept","to":"HalfGuard","type":"移行"},{"from":"ClosedGuard","to":"FlowerSweep","type":"スイープ"},{"from":"ClosedGuard","to":"ScissorsSweep","type":"スイープ"},{"from":"ClosedGuard","to":"Armbar","type":"極め"},{"from":"ClosedGuard","to":"Triangle","type":"極め"},{"from":"ClosedGuard","to":"Omoplata","type":"極め"},{"from":"OpenGuard","to":"Delariva","type":"移行"},{"from":"OpenGuard","to":"Spider","type":"移行"},{"from":"OpenGuard","to":"Lasso","type":"移行"},{"from":"OpenGuard","to":"Triangle","type":"極め"},{"from":"OpenGuard","to":"Armbar","type":"極め"},{"from":"ColSleeve","to":"Triangle","type":"極め"},{"from":"ColSleeve","to":"Omoplata","type":"極め"},{"from":"ColSleeve","to":"Armbar","type":"極め"},{"from":"ColSleeve","to":"FlowerSweep","type":"スイープ"},{"from":"Delariva","to":"DelarivaSweep","type":"スイープ"},{"from":"Delariva","to":"XGuard","type":"移行"},{"from":"Spider","to":"Triangle","type":"極め"},{"from":"Spider","to":"Omoplata","type":"極め"},{"from":"Spider","to":"Lasso","type":"移行"},{"from":"Spider","to":"HalfGuard","type":"移行"},{"from":"Spider","to":"SpiderSweep","type":"スイープ"},{"from":"Lasso","to":"Omoplata","type":"極め"},{"from":"Lasso","to":"Triangle","type":"極め"},{"from":"Lasso","to":"Spider","type":"移行"},{"from":"Lasso","to":"HalfGuard","type":"移行"},{"from":"HalfGuard","to":"KneeShield","type":"移行"},{"from":"KneeShield","to":"HalfGuard","type":"移行"},{"from":"KneeShield","to":"DeepHalf","type":"移行"},{"from":"KneeShield","to":"Armbar","type":"極め"},{"from":"KneeShield","to":"Triangle","type":"極め"},{"from":"XGuard","to":"OneLegX","type":"移行"},{"from":"OneLegX","to":"XGuard","type":"移行"},{"from":"OneLegX","to":"AnkleLock","type":"極め"},{"from":"Butterfly","to":"Mount","type":"スイープ"},{"from":"Butterfly","to":"XGuard","type":"移行"},{"from":"Butterfly","to":"OneLegX","type":"移行"},{"from":"FlowerSweep","to":"Mount","type":"移行"},{"from":"ScissorsSweep","to":"Mount","type":"移行"},{"from":"DelarivaSweep","to":"SideControl","type":"移行"},{"from":"SpiderSweep","to":"SideControl","type":"移行"},{"from":"SideControl","to":"Mount","type":"移行"},{"from":"SideControl","to":"BackControl","type":"移行"},{"from":"KneeOnBelly","to":"Mount","type":"移行"},{"from":"NorthSouth","to":"SideControl","type":"移行"},{"from":"Mount","to":"BackControl","type":"移行"},{"from":"BackControl","to":"Mount","type":"移行"},{"from":"SideControl","to":"Americana","type":"極め"},{"from":"SideControl","to":"Kimura","type":"極め"},{"from":"SideControl","to":"Armbar","type":"極め"},{"from":"KneeOnBelly","to":"Armbar","type":"極め"},{"from":"KneeOnBelly","to":"Baseball","type":"極め"},{"from":"NorthSouth","to":"NorthChoke","type":"極め"},{"from":"NorthSouth","to":"Kimura","type":"極め"},{"from":"Mount","to":"Armbar","type":"極め"},{"from":"Mount","to":"Choke","type":"極め"},{"from":"Mount","to":"Ezekiel","type":"極め"},{"from":"BackControl","to":"RNC","type":"極め"},{"from":"BackControl","to":"BowArrow","type":"極め"},{"from":"FrontHead","to":"Guillotine","type":"極め"},{"from":"FrontHead","to":"Anaconda","type":"極め"},{"from":"FrontHead","to":"Darce","type":"極め"}],"resistanceEdges":[{"attempted":"XGuard","resultsIn":"OneLegX","note":"- 失敗時: [[ワンレッグXガード]] やハーフガードへ戻す"},{"attempted":"Anaconda","resultsIn":"Darce","note":"- 失敗時: [[ダースチョーク]] やギロチンチョークへ移行"},{"attempted":"Americana","resultsIn":"Kimura","note":"- 失敗・対抗時:\n  - 相手が腕をピンと伸ばして逃げようとしてきたら、そのまま[[ストレートアームロック]]や腕十字固めに移行する。\n  - 相手が腕を伸ばした状態で向きを変えてきたら、即座に[[キムラロック]]へ切り替える（アメリカーナとキムラロックは表裏一体のコンビネーション）。相手の腕が「自分の頭の方向（上）」に曲がっていればアメリカーナ、「相手の腰の方向（下）」に曲がっていればキムラロックを狙うのが目安。中間で腕を伸ばして逃げようとする過渡期に「おでこで肘に蓋」をしてクラッチを入れ替え、表裏でハサミ撃ちにする。\n  - 相手が手のひらで自分の肘を押し戻そうとしてきたら、肘をコントロールして自分の肩を落とし、手首を極める（手首固め）。相手が下から脇を差そうと小指側から手をねじ込んで止まった瞬間も同様のリストロックのチャンス。"},{"attempted":"Omoplata","resultsIn":"Triangle","note":"- **失敗・相手の対抗時**: 相手が起き上がってきたらスイープに切り替えて上に乗る、または [[三角絞め]] や [[腕ひしぎ十字固め]] へ移行"},{"attempted":"Omoplata","resultsIn":"Armbar","note":"- **失敗・相手の対抗時**: 相手が起き上がってきたらスイープに切り替えて上に乗る、または [[三角絞め]] や [[腕ひしぎ十字固め]] へ移行"},{"attempted":"ScissorsSweep","resultsIn":"ClosedGuard","note":"- 失敗時: [[クローズドガード]]に戻る（ローリスク）"},{"attempted":"Spider","resultsIn":"Lasso","note":"- 失敗時: 相手にフックを外された場合は、[[ラッソーガード]] や [[ハーフガード]] への移行、またはクローズドガードに戻す"},{"attempted":"Spider","resultsIn":"HalfGuard","note":"- 失敗時: 相手にフックを外された場合は、[[ラッソーガード]] や [[ハーフガード]] への移行、またはクローズドガードに戻す"},{"attempted":"Delariva","resultsIn":"XGuard","note":"- 失敗時: [[Xガード]] やハーフガードへ戻す"},{"attempted":"NorthChoke","resultsIn":"Kimura","note":"- 失敗時: [[キムラロック]] やサイドコントロールへ移行"},{"attempted":"HalfGuard","resultsIn":"KneeShield","note":"- 失敗時: [[ニーシールド]] やフルガードに戻す"},{"attempted":"BackControl","resultsIn":"Mount","note":"- 失敗時: [[マウントポジション]] やサイドコントロールに移行"},{"attempted":"BowArrow","resultsIn":"RNC","note":"- 失敗時: 通常の[[裸絞め]]へ戻るか、腕ひしぎ十字固めに移行"},{"attempted":"Mount","resultsIn":"BackControl","note":"- 失敗時: [[バックコントロール]] への移行（相手が嫌がって背を向けた際）"},{"attempted":"Lasso","resultsIn":"Spider","note":"- 失敗時: 通常の[[スパイダーガード]]やハーフガードへ移行"},{"attempted":"OneLegX","resultsIn":"XGuard","note":"- 失敗時: 通常の [[Xガード]] へ移行"},{"attempted":"Triangle","resultsIn":"Omoplata","note":"- **失敗・相手の対抗時**: 相手が担いできたら [[オモプラッタ]] へ"},{"attempted":"Choke","resultsIn":"Armbar","note":"- 失敗時: 相手がディフェンスで両手を上げた際、[[腕ひしぎ十字固め]] や [[三角絞め]] へ移行"},{"attempted":"Choke","resultsIn":"Triangle","note":"- 失敗時: 相手がディフェンスで両手を上げた際、[[腕ひしぎ十字固め]] や [[三角絞め]] へ移行"},{"attempted":"Armbar","resultsIn":"Triangle","note":"- **失敗・相手の対抗時**: 相手がクラッチを固く組んで伸ばせない場合、クラッチ解除のテクニックを使うか、[[三角絞め]] や他のコントロールポジション（バックなど）へ移行"},{"attempted":"RNC","resultsIn":"BowArrow","note":"- 失敗・対抗時: 相手が両手で懸命にディフェンスしてきて極まりきらない場合は、道着の襟を使った「カラーチョーク（[[送り襟絞め]] や [[ボウアンドアローチョーク]] など）」やアームバーに切り替える。"}]}</script>
<script>
/* ===================== engine (pure logic) ===================== */
const MAX_STEPS = 8;

function buildIndex(graph){
  const nodesById = new Map(graph.nodes.map(n => [n.id, n]));
  const outEdges = new Map();
  for (const e of graph.edges){
    if (!outEdges.has(e.from)) outEdges.set(e.from, []);
    outEdges.get(e.from).push(e);
  }
  const resistanceByAttempted = new Map();
  for (const e of graph.resistanceEdges || []){
    if (!resistanceByAttempted.has(e.attempted)) resistanceByAttempted.set(e.attempted, []);
    resistanceByAttempted.get(e.attempted).push(e);
  }
  return { nodesById, outEdges, resistanceByAttempted };
}
function outDegree(index, id){ return (index.outEdges.get(id) || []).length; }

// Hides incomplete branches (dead-end, non-submission nodes) from play,
// per the approved plan's decision on graph gaps like ディープハーフガード.
function playableEdgesFrom(index, nodeId){
  return (index.outEdges.get(nodeId) || []).filter(e => {
    const dest = index.nodesById.get(e.to);
    if (!dest) return false;
    if (dest.category === 'submission') return true;
    return outDegree(index, e.to) > 0;
  });
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pickStartNode(graph, index){
  const candidates = graph.nodes.filter(n =>
    n.category === 'guard' && n.id !== 'GuardConcept' && playableEdgesFrom(index, n.id).length > 0
  );
  if (!candidates.length) return null;
  return candidates[Math.floor(Math.random() * candidates.length)].id;
}
function getChoicesFor(graph, index, nodeId, maxChoices){
  maxChoices = maxChoices || 4;
  const real = playableEdgesFrom(index, nodeId);
  const realSampleCount = Math.min(2, real.length);
  const realSample = shuffle(real).slice(0, realSampleCount);
  const realDestIds = new Set(real.map(e => e.to));
  realDestIds.add(nodeId);
  const realCategories = new Set(realSample.map(e => index.nodesById.get(e.to).category));

  const basePool = graph.nodes.filter(n =>
    !realDestIds.has(n.id) && (n.category === 'submission' || outDegree(index, n.id) > 0)
  );
  const distractorCount = Math.max(0, maxChoices - realSample.length);
  const biasedPool = basePool.filter(n => realCategories.has(n.category));
  const sourcePool = biasedPool.length >= distractorCount ? biasedPool : basePool;
  const distractors = shuffle(sourcePool).slice(0, distractorCount);

  const choices = [
    ...realSample.map(e => ({
      nodeId: e.to, label: index.nodesById.get(e.to).label,
      category: index.nodesById.get(e.to).category, edgeType: e.type, correct: true,
    })),
    ...distractors.map(n => ({
      nodeId: n.id, label: n.label, category: n.category, edgeType: null, correct: false,
    })),
  ];
  return shuffle(choices);
}
function isWin(index, nodeId){
  const n = index.nodesById.get(nodeId);
  return !!n && n.category === 'submission';
}

// 対戦モード: resolves what actually happens when the player attempts a move
// to toId from fromId. If toId has real resistance data (mined from the
// vault's 失敗・相手の対抗時 bullets) and hasn't already been resisted once
// this attempt, the defender escapes to resultsIn instead — unless
// resultsIn is the node the player just came from (e.g. Xガード⇄ワンレッグ
// Xガード), in which case that would be an invisible or self-looping no-op,
// so it's treated as a clean success instead. resistedSet is mutated so a
// technique only ever resists once per attempt (keeps every attempt
// finitely solvable).
function resolveMove(index, fromId, toId, resistedSet){
  const candidates = index.resistanceByAttempted.get(toId);
  if (!candidates || !candidates.length || resistedSet.has(toId)){
    return { toId, resisted:false, note:null };
  }
  const candidate = shuffle(candidates)[0];
  if (candidate.resultsIn === fromId){
    return { toId, resisted:false, note:null };
  }
  resistedSet.add(toId);
  return { toId: candidate.resultsIn, resisted:true, note: candidate.note };
}

/* ===================== app state & rendering ===================== */
const GRAPH = JSON.parse(document.getElementById('graph-data').textContent);
const INDEX = buildIndex(GRAPH);
const STORAGE_KEY = 'jj-tsumeshogi:v1';

const CATEGORY_LABEL = { guard:'ガード', top:'トップ', submission:'サブミッション', sweep:'スイープ', unknown:'?' };
const EDGE_VERB = { '極め':'で極める', 'スイープ':'へスイープ', '移行':'へ移行' };
const MODE_LABEL = { '1shu':'1手クイズ', 'tsume':'詰将棋モード', 'vs':'対戦モード' };

function loadStats(){
  const defaults = { bestStreak:0, currentStreak:0, puzzlesSolved:0, attemptsTotal:0, lastPlayedAt:null,
    vsWins:0, vsAttempts:0, vsResistsSurvived:0 };
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) throw new Error('none');
    return Object.assign(defaults, JSON.parse(raw));
  }catch(e){
    return defaults;
  }
}
function saveStats(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){ /* private mode etc: ignore */ }
}

const state = {
  screen:'start',           // start | puzzle | attempt-failed | result
  mode:'1shu',               // 1shu | tsume | vs
  chain:[],                  // [{id, viaType, revealed, resisted}]
  choices:[],
  locked:false,
  selectedId:null,
  vsResolved:null,           // 対戦モード: {toId, resisted, note} for the current locked choice
  resistedSet:new Set(),     // 対戦モード: attempted-node ids already resisted this attempt
  lastOutcome:null,          // 'win' | 'win-vs-resist' | 'win-revealed' | 'nomate' | 'failed'
  stats: loadStats(),
};

// Resets per-attempt state (chain + resistance tracking) for a fresh start
// or a "同じスタートでもう一度" retry — factored into one place so both
// call sites stay in sync (a prior version of this file duplicated the
// chain-reset logic, which is exactly the kind of drift this avoids).
function resetAttempt(startId){
  state.chain = [{ id:startId, viaType:null, revealed:false, resisted:false }];
  state.resistedSet = new Set();
  state.vsResolved = null;
  if (state.mode === 'vs'){
    state.stats.vsAttempts = (state.stats.vsAttempts || 0) + 1;
    saveStats(state.stats);
  }
}

function esc(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Escapes for safe HTML insertion, then renders the vault notes' "**強調**"
// markdown convention as <strong> so excerpts don't show literal asterisks.
function formatBody(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[\[([^\]]+)\]\]/g, '$1'); // Obsidian wikilinks -> plain text, no note to link to here
}

function categoryChip(cat){
  return `<span class="chip cat-${esc(cat)}"><span class="dot"></span>${esc(CATEGORY_LABEL[cat] || cat)}</span>`;
}

function renderBreadcrumb(){
  const items = state.chain.map((step, i) => {
    const node = INDEX.nodesById.get(step.id);
    const crumb = `<span class="crumb"><span class="dot" style="background:var(--${catVar(node.category)})"></span>${esc(node.label)}</span>`;
    return i === 0 ? crumb : `<span class="arrow">→</span>${crumb}`;
  }).join('');
  return `<div class="breadcrumb">${items}</div>`;
}
function catVar(cat){ return cat === 'guard' ? 'ai' : cat === 'top' ? 'jade' : cat === 'submission' ? 'shu' : cat === 'sweep' ? 'kin' : 'ink-faint'; }

function excerptHtml(content){
  if (!content || (!content.steps && !content.tips)){
    return '';
  }
  let body = '';
  if (content.steps) body += `<h4>手順</h4>${formatBody(content.steps)}`;
  if (content.tips) body += `<h4>コツ・注意点</h4>${formatBody(content.tips)}`;
  return `<details class="excerpt"><summary>手順・コツを見る</summary><div class="body">${body}</div></details>`;
}

function renderStart(){
  const s = state.stats;
  document.getElementById('app').innerHTML = `
    <div class="top-title">
      <h1>柔術詰将棋</h1>
      <span class="kana">JIU-JITSU TSUMESHOGI</span>
    </div>
    <p class="lede">今のポジションから、正しい一手を選んでタップまでつなげよう。</p>

    <div class="mode-toggle" role="tablist">
      <button class="${state.mode==='1shu'?'active':''}" data-mode="1shu">1手クイズ</button>
      <button class="${state.mode==='tsume'?'active':''}" data-mode="tsume">詰将棋モード</button>
      <button class="${state.mode==='vs'?'active':''}" data-mode="vs">対戦モード</button>
    </div>

    <div class="stat-row">
      <div class="stat"><span class="num">${s.bestStreak}</span><span class="label">ベストストリーク</span></div>
      <div class="stat"><span class="num">${s.puzzlesSolved}</span><span class="label">詰み達成数</span></div>
      <div class="stat"><span class="num">${s.attemptsTotal}</span><span class="label">総手数</span></div>
    </div>

    <button class="btn btn-primary" id="start-btn">ランダムに開始</button>

    <footer class="hint">${
      state.mode==='1shu' ? '1手ずつ出題。間違えても正解を見て次に進めます。' :
      state.mode==='tsume' ? '間違えたらそのパズルは失敗。同じスタートからやり直せます。' :
      '正しい技を選んでも、実際のノートに基づいて相手が抵抗し、別の展開になることがあります。抵抗は失敗になりません — 間違った技を選んだ時だけそのパズルは失敗です。'
    }</footer>
  `;
  document.querySelectorAll('.mode-toggle button').forEach(btn => {
    btn.addEventListener('click', () => { state.mode = btn.dataset.mode; renderStart(); });
  });
  document.getElementById('start-btn').addEventListener('click', startRound);
}

function startRound(){
  const startId = pickStartNode(GRAPH, INDEX);
  resetAttempt(startId);
  state.screen = 'puzzle';
  state.lastOutcome = null;
  prepareQuestion();
}
function prepareQuestion(){
  const cur = state.chain[state.chain.length - 1].id;
  state.choices = getChoicesFor(GRAPH, INDEX, cur);
  state.locked = false;
  state.selectedId = null;
  renderPuzzle();
}

function renderPuzzle(){
  const step = state.chain[state.chain.length - 1];
  const node = INDEX.nodesById.get(step.id);
  const app = document.getElementById('app');

  const choicesHtml = state.choices.map((c, i) => {
    let cls = 'btn choice';
    if (state.locked){
      if (c.nodeId === state.selectedId && c.correct) cls += ' is-correct';
      else if (c.nodeId === state.selectedId && !c.correct) cls += ' is-wrong';
      else if (c.correct) cls += ' is-reveal';
    }
    const verb = c.edgeType ? (EDGE_VERB[c.edgeType] || 'へ') : 'へ';
    return `<button class="${cls}" data-idx="${i}" ${state.locked ? 'disabled' : ''}>
      <span class="dest-label">${esc(c.label)}${esc(verb)}</span>
      <span class="chip">${categoryChip(c.category)}</span>
    </button>`;
  }).join('');

  let feedbackHtml = '';
  if (state.locked){
    const picked = state.choices.find(c => c.nodeId === state.selectedId);
    if (picked && picked.correct && state.mode === 'vs' && state.vsResolved && state.vsResolved.resisted){
      const resultNode = INDEX.nodesById.get(state.vsResolved.toId);
      feedbackHtml = `<div class="feedback resist">
        <div class="fb-title resist-text">相手が抵抗！ → ${esc(resultNode.label)}</div>
        <div class="fb-body">${formatBody(state.vsResolved.note)}</div>
      </div>`;
    } else if (picked && picked.correct){
      const destNode = INDEX.nodesById.get(picked.nodeId);
      const tipsExcerpt = destNode.content && destNode.content.tips ? truncate(destNode.content.tips, 160) : '';
      feedbackHtml = `<div class="feedback ok">
        <div class="fb-title ok-text">正解</div>
        <div class="fb-body">${tipsExcerpt ? formatBody(tipsExcerpt) : esc(`${destNode.label}へつながりました。`)}</div>
      </div>`;
    } else if (picked){
      const correctOnes = state.choices.filter(c => c.correct);
      const names = correctOnes.map(c => `${c.label}${c.edgeType?`（${c.edgeType}）`:''}`).join(' / ');
      const correctNode = correctOnes.length ? INDEX.nodesById.get(correctOnes[0].nodeId) : null;
      const counter = correctNode && correctNode.content && correctNode.content.counter
        ? truncate(correctNode.content.counter, 220)
        : `${node.label}からは、そこへ直接はつながりません。`;
      feedbackHtml = `<div class="feedback ng">
        <div class="fb-title ng-text">不正解 — 正解は「${esc(names)}」</div>
        <div class="fb-body">参考: この場面での対策情報\n${formatBody(counter)}</div>
      </div>`;
    }
  }

  let continueHtml = '';
  if (state.locked){
    const picked = state.choices.find(c => c.nodeId === state.selectedId);
    if (picked && picked.correct){
      continueHtml = `<button class="btn btn-primary" id="continue-btn" style="margin-top:1rem;">次へ</button>`;
    } else if (state.mode === '1shu'){
      continueHtml = `<button class="btn btn-primary" id="continue-btn" style="margin-top:1rem;">正解を見て次へ</button>`;
    } else {
      continueHtml = `<button class="btn btn-primary" id="fail-btn" style="margin-top:1rem;">結果を見る</button>`;
    }
  }

  app.innerHTML = `
    <div class="top-title">
      <h1 style="font-size:1.15rem;">柔術詰将棋</h1>
      <span class="kana">${MODE_LABEL[state.mode]}</span>
    </div>
    ${renderBreadcrumb()}
    <div class="frame">
      <div class="frame-inner">
        <div class="step-no">第${state.chain.length}手</div>
        ${categoryChip(node.category)}
        <div class="node-label">${esc(node.label)}</div>
        <div class="prompt">次の一手は？</div>
        ${excerptHtml(node.content)}
      </div>
    </div>
    <div class="btn-stack">${choicesHtml}</div>
    ${feedbackHtml}
    ${continueHtml}
  `;

  document.querySelectorAll('.choice').forEach(btn => {
    btn.addEventListener('click', () => handleChoice(state.choices[Number(btn.dataset.idx)]));
  });
  const continueBtn = document.getElementById('continue-btn');
  if (continueBtn) continueBtn.addEventListener('click', onContinue);
  const failBtn = document.getElementById('fail-btn');
  if (failBtn) failBtn.addEventListener('click', () => showResult('failed'));
}

function truncate(s, n){
  if (!s) return s;
  return s.length > n ? s.slice(0, n).trim() + '…' : s;
}

function handleChoice(choice){
  if (state.locked) return;
  state.locked = true;
  state.selectedId = choice.nodeId;
  state.vsResolved = null;
  state.stats.attemptsTotal++;

  if (choice.correct){
    if (state.mode === '1shu'){
      state.stats.currentStreak = (state.stats.currentStreak || 0) + 1;
      state.stats.bestStreak = Math.max(state.stats.bestStreak || 0, state.stats.currentStreak);
    }
    if (state.mode === 'vs'){
      const fromId = state.chain[state.chain.length - 1].id;
      state.vsResolved = resolveMove(INDEX, fromId, choice.nodeId, state.resistedSet);
      if (state.vsResolved.resisted) state.stats.vsResistsSurvived = (state.stats.vsResistsSurvived || 0) + 1;
    }
  } else {
    if (state.mode === '1shu') state.stats.currentStreak = 0;
  }
  state.stats.lastPlayedAt = new Date().toISOString();
  saveStats(state.stats);
  renderPuzzle();
}

function onContinue(){
  const picked = state.choices.find(c => c.nodeId === state.selectedId);
  let nextId, revealed, viaType, resisted = false;
  if (picked.correct){
    if (state.mode === 'vs' && state.vsResolved){
      nextId = state.vsResolved.toId;
      resisted = state.vsResolved.resisted;
    } else {
      nextId = picked.nodeId;
    }
    revealed = false;
    viaType = picked.edgeType;
  } else {
    // 1手クイズのみここに来る: 正解の一つへ自動で進めて学習を続ける
    const correctOne = state.choices.find(c => c.correct);
    nextId = correctOne.nodeId; revealed = true; viaType = correctOne.edgeType;
  }
  state.chain.push({ id: nextId, viaType, revealed, resisted });
  state.vsResolved = null;

  if (isWin(INDEX, nextId)){
    if (!revealed) state.stats.puzzlesSolved++;
    if (state.mode === 'vs') state.stats.vsWins = (state.stats.vsWins || 0) + 1;
    saveStats(state.stats);
    showResult(revealed ? 'win-revealed' : (resisted ? 'win-vs-resist' : 'win'));
    return;
  }
  if (state.chain.length > MAX_STEPS){
    showResult('nomate');
    return;
  }
  prepareQuestion();
}

function showResult(outcome){
  state.screen = 'result';
  state.lastOutcome = outcome;
  renderResult();
}

function renderResult(){
  const app = document.getElementById('app');
  const outcome = state.lastOutcome;
  const isWinOutcome = outcome === 'win' || outcome === 'win-revealed' || outcome === 'win-vs-resist';

  let headline = '';
  let stampHtml = '';
  if (outcome === 'win'){
    headline = state.mode === 'tsume' ? '詰み！ノーミスでタップまで到達'
      : state.mode === 'vs' ? '詰み！攻めきった'
      : 'タップ達成！';
    if (state.mode === 'tsume' || state.mode === 'vs'){
      stampHtml = `<div class="stamp-wrap"><div class="stamp"><span>詰</span></div></div>`;
    } else {
      stampHtml = `<div class="tap-chip">${categoryChip('submission')}</div>`;
    }
  } else if (outcome === 'win-vs-resist'){
    headline = '詰み！（相手の抵抗を返り討ち）';
    stampHtml = `<div class="stamp-wrap"><div class="stamp"><span>詰</span></div></div>`;
  } else if (outcome === 'win-revealed'){
    headline = 'タップまで到達（正解を見た手あり）';
    stampHtml = `<div class="tap-chip">${categoryChip('submission')}</div>`;
  } else if (outcome === 'failed'){
    headline = '不成立 — このパズルは失敗';
  } else {
    headline = '不詰み — 手数切れ';
  }

  const ledgerHtml = state.chain.map((step, i) => {
    const node = INDEX.nodesById.get(step.id);
    const via = step.viaType ? `<div class="l-via">経由: ${esc(step.viaType)}</div>` : '';
    const revealedTag = step.revealed ? `<span class="l-revealed">正解を見た</span>` : '';
    const resistedTag = step.resisted ? `<span class="l-resisted">相手が抵抗</span>` : '';
    return `<li class="cat-${esc(node.category)}">
      <div class="l-head">
        <span class="l-no">${i+1}</span>
        <span class="l-label">${esc(node.label)}</span>
        ${categoryChip(node.category)}
        ${revealedTag}${resistedTag}
      </div>
      ${i>0?via:''}
    </li>`;
  }).join('');

  const sub = isWinOutcome
    ? `全${state.chain.length}手のチェーン`
    : (outcome === 'failed'
        ? '同じスタートから、もう一度挑戦できます。'
        : `${MAX_STEPS}手以内にタップへ到達できませんでした。`);

  app.innerHTML = `
    <div class="top-title">
      <h1 style="font-size:1.15rem;">柔術詰将棋</h1>
      <span class="kana">${MODE_LABEL[state.mode]}</span>
    </div>
    ${stampHtml}
    <div class="result-heading">${esc(headline)}</div>
    <div class="result-sub">${esc(sub)}</div>
    <ol class="ledger">${ledgerHtml}</ol>
    <div class="btn-row">
      <button class="btn" id="retry-btn">同じスタートでもう一度</button>
      <button class="btn btn-primary" id="new-btn">新しいパズル</button>
    </div>
    <div class="stat-row" style="margin-top:1.4rem;">
      <div class="stat"><span class="num">${state.stats.bestStreak}</span><span class="label">ベストストリーク</span></div>
      <div class="stat"><span class="num">${state.stats.puzzlesSolved}</span><span class="label">詰み達成数</span></div>
      <div class="stat"><span class="num">${state.stats.attemptsTotal}</span><span class="label">総手数</span></div>
    </div>
    <footer class="hint"><a href="#" id="home-link">スタート画面に戻る</a></footer>
  `;

  const startId = state.chain[0].id;
  document.getElementById('retry-btn').addEventListener('click', () => {
    resetAttempt(startId);
    prepareQuestion();
  });
  document.getElementById('new-btn').addEventListener('click', startRound);
  document.getElementById('home-link').addEventListener('click', (e) => { e.preventDefault(); state.screen='start'; renderStart(); });
}

/* ===================== boot ===================== */
renderStart();
</script>

</body></html>
